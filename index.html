<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OPERAÇÃO YUSEN - PANASONIC SJC</title>

<style>

:root{
  --bg:#0b2441;
  --line:rgba(255,255,255,0.12);
  --text:#edf4ff;
  --muted:#dfeafc;

  --yellow:#f6d34c;
  --yellow-strong:#e8c33b;

  --purple:#9d69ff;
  --purple-strong:#7c4ee4;

  --green:#34d38f;
  --green-strong:#20a86c;

  --orange:#ff9f1c;
  --orange-strong:#e67e00;

  --shadow:0 14px 32px rgba(0,0,0,0.28);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at top,
      rgba(76,132,214,0.28),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #0b2441 0%,
      #050f1d 100%
    );

  color:var(--text);
  font-family:Arial,sans-serif;
}


/* ==================================================
   CABEÇALHO
================================================== */

.header{

  background:
    linear-gradient(
      90deg,
      #0d3d68 0%,
      #0f4d7c 35%,
      #0a2d49 100%
    );

  padding:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-bottom:1px solid var(--line);

  box-shadow:var(--shadow);

  min-height:105px;
}

.header-text{
  width:100%;
  text-align:center;
}

.header h1{

  margin:0;

  font-size:32px;

  letter-spacing:0.5px;

  font-weight:700;

  text-transform:uppercase;
}

#relogio{

  margin-top:6px;

  font-size:18px;

  color:var(--muted);

  font-weight:600;

}


/* ==================================================
   TICKER PIN
================================================== */

.ticker{

  width:100%;

  height:55px;

  background:
    linear-gradient(
      90deg,
      #081421,
      #111d29,
      #081421
    );

  border-bottom:
    2px solid var(--yellow);

  align-items:center;

  overflow:hidden;

  box-shadow:
    0 6px 18px rgba(0,0,0,0.30);
}

.ticker-label{

  height:100%;

  min-width:210px;

  padding:0 20px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      var(--yellow),
      var(--yellow-strong)
    );

  color:#111827;

  font-size:18px;

  font-weight:900;

  white-space:nowrap;
}

.ticker-area{

  position:relative;

  flex:1;

  overflow:hidden;

  height:100%;

  display:flex;

  align-items:center;
}

.ticker-content{

  position:absolute;

  white-space:nowrap;

  left:100%;

  font-size:20px;

  font-weight:900;

  color:#fff;

  animation:
    tickerMovimento 25s linear infinite;
}

@keyframes tickerMovimento{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-200%);
  }

}


/* ==================================================
   KPIs
================================================== */

.kpis{

  display:flex;

  justify-content:center;

  gap:16px;

  padding:18px 20px 8px;

  flex-wrap:wrap;
}

.kpi{

  min-width:180px;

  padding:15px 18px;

  border-radius:14px;

  font-size:17px;

  font-weight:800;

  text-align:center;

  box-shadow:var(--shadow);

  text-transform:uppercase;
}


/* ATRASADO */

.kpi-atrasado{

  background:
    linear-gradient(
      135deg,
      #ff4b5d,
      #e22d42
    );

  animation:
    pulse-alert 2s infinite;
}

@keyframes pulse-alert{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}


/* AGUARDANDO */

.kpi-aguardando{

  background:
    linear-gradient(
      135deg,
      #536475,
      #344454
    );
}


/* NO PATIO */

.kpi-patio{

  background:
    linear-gradient(
      135deg,
      var(--orange),
      var(--orange-strong)
    );

  color:#17130c;
}


/* EM PROCESSO */

.kpi-processo{

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple-strong)
    );
}


/* FINALIZADO */

.kpi-finalizado{

  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green-strong)
    );
}


/* ==================================================
   SEÇÕES
================================================== */

.section{

  margin:20px 18px 10px;

  background:
    rgba(13,28,44,0.78);

  border:
    1px solid var(--line);

  border-radius:14px;

  overflow:hidden;

  box-shadow:var(--shadow);
}

.section-title{

  background:
    linear-gradient(
      90deg,
      var(--yellow),
      var(--yellow-strong)
    );

  color:#0f172a;

  padding:11px 20px;

  text-align:center;

  font-size:23px;

  font-weight:900;

  letter-spacing:1px;
}


/* ==================================================
   TABELAS
================================================== */

.table-container{

  width:100%;

  overflow-x:auto;
}

table{

  width:100%;

  border-collapse:collapse;
}

th{

  background:
    rgba(20,23,28,0.95);

  color:var(--yellow);

  padding:12px 7px;

  font-size:14px;

  font-weight:800;

  text-transform:uppercase;

  border-bottom:
    1px solid var(--line);

  white-space:nowrap;
}

td{

  padding:12px 7px;

  text-align:center;

  font-size:16px;

  font-weight:700;

  border-bottom:
    1px solid rgba(255,255,255,0.06);

  white-space:nowrap;
}


/* ==================================================
   CORES DAS LINHAS
================================================== */

tr.atrasado td{

  background:
    rgba(103,15,29,0.90);

  color:#fff3f5;

  font-weight:900;
}


tr.aguardando td{

  background:
    rgba(50,65,80,0.78);

  color:#edf4ff;
}


tr.patio td{

  background:
    rgba(116,76,13,0.87);

}


tr.processo td{

  background:

}


tr.finalizado td{

  background:
    rgba(20,77,58,0.85);

}


/* ==================================================
   JANELA E TEMPO
================================================== */

.janela{

  color:#ff6874;

  font-weight:900;
}

.horario{

  font-weight:900;
}


/* TEMPO NORMAL */

.tempo-normal{

  color:#59e39e;

  font-weight:900;
}


/* TEMPO DE ATENÇÃO */

.tempo-atencao{

  color:#ffe066;

  font-weight:900;
}


/* TEMPO CRÍTICO */

.tempo-critico{

  color:#ff737d;

  font-weight:900;

  animation:
    piscarTempo 1.5s infinite;
}


@keyframes piscarTempo{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:0.60;
  }

}


/* ==================================================
   RODAPÉ
================================================== */

.footer{

  text-align:center;

  padding:18px 20px 28px;

  font-size:14px;

  color:var(--muted);

/* ==================================================

================================================== */

@media(max-width:1100px){

  th{
    font-size:11px;
  }

  }

<script>


/* ==================================================
   GOOGLE SHEETS
================================================== */

var csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";


var csvNFs =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=141918402&single=true&output=csv";


/* ==================================================
   RELÓGIO
================================================== */

function atualizarRelogio(){

  var agora =
    new Date();

  document
    .getElementById("relogio")
    .innerHTML =

    agora.toLocaleDateString("pt-BR")

    +

    " - "

    +

    agora.toLocaleTimeString("pt-BR");

}


setInterval(
  atualizarRelogio,
  1000
);

atualizarRelogio();


/* ==================================================
   TRANSFORMA HORÁRIO HH:MM EM DATA DE HOJE
================================================== */

function horarioParaData(horario){

  if(!horario){
    return null;
  }


  var partes =
    horario
    .trim()
    .split(":");


  if(partes.length < 2){
    return null;
  }


  var hora =
    parseInt(
      partes[0],
      10
    );


  var minuto =
    parseInt(
      partes[1],
      10
    );


  if(
    isNaN(hora)
    ||
    isNaN(minuto)
  ){
    return null;
  }


  var data =
    new Date();


  data.setHours(
    hora,
    minuto,
    0,
    0
  );


  return data;

}


/* ==================================================
   DIFERENÇA EM MINUTOS
================================================== */

function diferencaMinutos(dataInicial,dataFinal){

  if(
    !dataInicial
    ||
    !dataFinal
  ){

    return null;

  }


  return Math.floor(

    (
      dataFinal.getTime()
      -
      dataInicial.getTime()
    )

    /

    60000

  );

}


/* ==================================================
   FORMATA DURAÇÃO
================================================== */

function formatarDuracao(minutos){

  if(
    minutos === null
    ||
    minutos < 0
  ){

    return "";

  }


  var horas =
    Math.floor(
      minutos / 60
    );


  var mins =
    minutos % 60;


  if(horas > 0){

    return (

      String(horas)
      .padStart(2,"0")

      +

      ":"

      +

      String(mins)
      .padStart(2,"0")

    );

  }


  return minutos + " MIN";

}


/* ==================================================
   STATUS
================================================== */

function normalizarStatus(status){

  return (
    status || ""
  )
  .trim()
  .toUpperCase();

}


function statusEmoticon(status){

  var s =
    normalizarStatus(status);


  if(
    s.indexOf("ATRASADO") !== -1
  ){

    return "🚨 ATRASADO";

  }


  if(
    s.indexOf("AGUARDANDO") !== -1
  ){

    return "⏳ AGUARDANDO";

  }


  if(
    s.indexOf("NO PATIO") !== -1
    ||
    s.indexOf("NO PÁTIO") !== -1
  ){

    return "🚚 NO PATIO";

  }


  if(
    s.indexOf("EM PROCESSO") !== -1
  ){

    return "📦 EM PROCESSO";

  }


  if(
    s.indexOf("FINALIZADO") !== -1
  ){

    return "✅ FINALIZADO";

  }


  return status || "";

}


/* ==================================================
   CLASSE DO STATUS
================================================== */

function classeStatus(status){

  var s =
    normalizarStatus(status);


  if(
    s.indexOf("ATRASADO") !== -1
  ){

    return "atrasado";

  }


  if(
    s.indexOf("NO PATIO") !== -1
    ||
    s.indexOf("NO PÁTIO") !== -1
  ){

    return "patio";

  }


  if(
    s.indexOf("EM PROCESSO") !== -1
  ){

    return "processo";

  }


  if(
    s.indexOf("AGUARDANDO") !== -1
  ){

    return "aguardando";

  }


  if(
    s.indexOf("FINALIZADO") !== -1
  ){

    return "finalizado";

  }


  return "";

}


/* ==================================================
   PRIORIDADE PARA ORDENAÇÃO
================================================== */

function prioridadeStatus(status){

  var s =
    normalizarStatus(status);


  if(
    s.indexOf("ATRASADO") !== -1
  ){
    return 1;
  }


  if(
    s.indexOf("NO PATIO") !== -1
    ||
    s.indexOf("NO PÁTIO") !== -1
  ){
    return 2;
  }


  if(
    s.indexOf("EM PROCESSO") !== -1
  ){
    return 3;
  }


  if(
    s.indexOf("AGUARDANDO") !== -1
  ){
    return 4;
  }


  if(
    s.indexOf("FINALIZADO") !== -1
  ){
    return 5;
  }


  return 6;

}


/* ==================================================
   CALCULA TEMPO OPERACIONAL
================================================== */

function calcularTempo(item){

  var agora =
    new Date();


  var status =
    normalizarStatus(
      item.status
    );


  /* ================================================
     FINALIZADO

     NÃO MOSTRA TEMPO
  ================================================ */

  if(
    status.indexOf("FINALIZADO") !== -1
  ){

    return {
      texto:"",
      classe:""
    };

  }


  /* ================================================
     ATRASADO

     HORA ATUAL - JANELA
  ================================================ */

  if(
    status.indexOf("ATRASADO") !== -1
  ){


    var dataJanela =
      horarioParaData(
        item.janela
      );


    var atraso =
      diferencaMinutos(
        dataJanela,
        agora
      );


    if(
      atraso !== null
      &&
      atraso >= 0
    ){

      return {

        texto:
          "🔴 ATRASO " +
          formatarDuracao(atraso),

        classe:
          "tempo-critico"

      };

    }


    return {
      texto:"",
      classe:""
    };

  }


  /* ================================================
     AGUARDANDO

     CONTAGEM PARA A JANELA
  ================================================ */

  if(
    status.indexOf("AGUARDANDO") !== -1
  ){


    var janela =
      horarioParaData(
        item.janela
      );


    if(!janela){

      return {
        texto:"",
        classe:""
      };

    }


    var faltam =
      diferencaMinutos(
        agora,
        janela
      );


    if(faltam === null){

      return {
        texto:"",
        classe:""
      };

    }


    if(faltam >= 15){

      return {

        texto:
          "🟢 FALTAM " +
          formatarDuracao(faltam),

        classe:
          "tempo-normal"

      };

    }


    if(
      faltam >= 5
      &&
      faltam < 15
    ){

      return {

        texto:
          "🟡 FALTAM " +
          formatarDuracao(faltam),

        classe:
          "tempo-atencao"

      };

    }


    if(
      faltam >= 0
      &&
      faltam < 5
    ){

      return {

        texto:
          "🔴 FALTAM " +
          formatarDuracao(faltam),

        classe:
          "tempo-critico"

      };

    }


    /*
       CASO O STATUS AINDA ESTEJA
       AGUARDANDO MAS A JANELA
       JÁ TENHA PASSADO
    */

    var passou =
      Math.abs(faltam);


    return {

      texto:
        "🔴 ATRASO " +
        formatarDuracao(passou),

      classe:
        "tempo-critico"

    };

  }


  /* ================================================
     NO PATIO

     HORA ATUAL - CHEGADA
  ================================================ */

  if(
    status.indexOf("NO PATIO") !== -1
    ||
    status.indexOf("NO PÁTIO") !== -1
  ){


    var chegada =
      horarioParaData(
        item.chegada
      );


    var tempoPatio =
      diferencaMinutos(
        chegada,
        agora
      );


    if(
      tempoPatio !== null
      &&
      tempoPatio >= 0
    ){

      return {

        texto:
          "🕒 " +
          formatarDuracao(
            tempoPatio
          ),

        classe:
          "tempo-atencao"

      };

    }


    return {
      texto:"",
      classe:""
    };

  }


  /* ================================================
     EM PROCESSO

     HORA ATUAL - INÍCIO
  ================================================ */

  if(
    status.indexOf("EM PROCESSO") !== -1
  ){


    var inicio =
      horarioParaData(
        item.inicio
      );


    var tempoProcesso =
      diferencaMinutos(
        inicio,
        agora
      );


    if(
      tempoProcesso !== null
      &&
      tempoProcesso >= 0
    ){

      return {

        texto:
          "🕒 " +
          formatarDuracao(
            tempoProcesso
          ),

        classe:
          "tempo-atencao"

      };

    }


    return {
      texto:"",
      classe:""
    };

  }


  return {
    texto:"",
    classe:""
  };

}


/* ==================================================
   CARREGA PIN / NF
================================================== */

async function carregarNFs(){

  try{


    var resposta =
      await fetch(

        csvNFs +

        "&t=" +

        new Date().getTime()

      );


    var texto =
      await resposta.text();


    var linhas =
      texto
      .replace(/\r/g,"")
      .split("\n");


    var nfs = [];


    for(
      var i = 1;
      i < linhas.length;
      i++
    ){


      var nf =
        linhas[i]
        .split(",")[0]
        .replace(/"/g,"")
        .trim();


      if(nf !== ""){

        nfs.push(nf);

      }

    }


    var container =
      document
      .getElementById(
        "tickerContainer"
      );


    var ticker =
      document
      .getElementById(
        "tickerNFs"
      );


    if(
      nfs.length > 0
    ){


      var textoTicker =
        nfs

        .map(
          function(nf){

            return "📄 NF " + nf;

          }
        )

        .join(
          "　◆　"
        );


      ticker.innerHTML =

        textoTicker

        +

        "　◆　"

        +

        textoTicker;


      container.style.display =
        "flex";

    }


    else{


      ticker.innerHTML =
        "";


      container.style.display =
        "none";

    }


  }


  catch(erro){


    document
      .getElementById(
        "tickerContainer"
      )
      .style.display =
      "none";


  }

}


/* ==================================================
   DADOS GUARDADOS NA MEMÓRIA DO PAINEL

   ISSO PERMITE RECALCULAR O TEMPO
   SEM PRECISAR BAIXAR A PLANILHA.
================================================== */

var dadosOperacao = [];


/* ==================================================
   CARREGA PLANILHA
================================================== */

async function carregarDados(){

  try{


    var resposta =
      await fetch(

        csvUrl +

        "&t=" +

        new Date().getTime()

      );


    var texto =
      await resposta.text();


    var linhas =
      texto
      .replace(/\r/g,"")
      .split("\n");


    dadosOperacao = [];


    var secaoAtual =
      "";


    for(
      var i = 0;
      i < linhas.length;
      i++
    ){


      var colunas =
        linhas[i]
        .split(",")
        .map(
          function(x){

            return x
              .replace(/^"|"$/g,"")
              .trim();

          }
        );


      var primeira =
        (
          colunas[0]
          ||
          ""
        )
        .trim()
        .toUpperCase();


      /* ================================================
         SEÇÃO
      ================================================ */

      if(
        primeira === "ENERGY"
        ||
        primeira === "AUTOMOTIVO"
      ){

        secaoAtual =
          primeira;

        continue;

      }


      /* IGNORA CABEÇALHO */

      if(
        primeira ===
        "TRANSPORTADORA"
      ){

        continue;

      }


      /* IGNORA VAZIO */

      if(!primeira){

        continue;

      }


      if(!secaoAtual){

        continue;

      }


      dadosOperacao.push({

        secao:
          secaoAtual,

        transportadora:
          colunas[0] || "",

        operacao:
          colunas[1] || "",

        veiculo:
          colunas[2] || "",

        janela:
          colunas[3] || "",

        peso:
          colunas[4] || "",

        status:
          colunas[5] || "",

        chegada:
          colunas[6] || "",

        inicio:
          colunas[7] || "",

        fim:
          colunas[8] || ""

      });

    }


    renderizarPainel();


  }


  catch(erro){


    console.error(
      erro
    );


    document
      .getElementById(
        "conteudo"
      )
      .innerHTML =

      "<div style='margin:20px;padding:20px;background:#7a1724;color:white;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;'>⚠️ Erro ao carregar os dados do painel.</div>";

  }

}


/* ==================================================
   RENDERIZA TODO O PAINEL
================================================== */

function renderizarPainel(){


  var atrasados = 0;

  var aguardando = 0;

  var noPatio = 0;

  var emProcesso = 0;

  var finalizados = 0;


  /* ==================================================
     CONTADORES
  ================================================== */

  for(
    var i = 0;
    i < dadosOperacao.length;
    i++
  ){


    var s =
      normalizarStatus(
        dadosOperacao[i].status
      );


    if(
      s.indexOf("ATRASADO") !== -1
    ){

      atrasados++;

    }


    else if(
      s.indexOf("NO PATIO") !== -1
      ||
      s.indexOf("NO PÁTIO") !== -1
    ){

      noPatio++;

    }


    else if(
      s.indexOf("EM PROCESSO") !== -1
    ){

      emProcesso++;

    }


    else if(
      s.indexOf("AGUARDANDO") !== -1
    ){

      aguardando++;

    }


    else if(
      s.indexOf("FINALIZADO") !== -1
    ){

      finalizados++;

    }

  }


  /* ==================================================
     CARDS
  ================================================== */

  document
    .getElementById(
      "painelKpi"
    )
    .innerHTML = `


    <div class="kpi kpi-atrasado">

      🚨 ATRASADOS:
      ${atrasados}

    </div>


    <div class="kpi kpi-aguardando">

      ⏳ AGUARDANDO:
      ${aguardando}

    </div>


    <div class="kpi kpi-patio">

      🚚 NO PATIO:
      ${noPatio}

    </div>


    <div class="kpi kpi-processo">

      📦 EM PROCESSO:
      ${emProcesso}

    </div>


    <div class="kpi kpi-finalizado">

      ✅ FINALIZADOS:
      ${finalizados}

    </div>

  `;


  /* ==================================================
     SEÇÕES
  ================================================== */

  var secoes = [
    "ENERGY",
    "AUTOMOTIVO"
  ];


  var html = "";


  for(
    var s = 0;
    s < secoes.length;
    s++
  ){


    var nomeSecao =
      secoes[s];


    var itens =
      dadosOperacao
      .filter(
        function(item){

          return (
            item.secao === nomeSecao
          );

        }
      );


    if(
      itens.length === 0
    ){

      continue;

    }


    /* ==================================================
       ORDENAÇÃO AUTOMÁTICA

       1 ATRASADO
       2 NO PATIO
       3 EM PROCESSO
       4 AGUARDANDO
       5 FINALIZADO

       DENTRO DO MESMO STATUS:
       MENOR JANELA PRIMEIRO
    ================================================== */

    itens.sort(

      function(a,b){


        var prioridadeA =
          prioridadeStatus(
            a.status
          );


        var prioridadeB =
          prioridadeStatus(
            b.status
          );


        if(
          prioridadeA !== prioridadeB
        ){

          return (
            prioridadeA
            -
            prioridadeB
          );

        }


        var janelaA =
          horarioParaData(
            a.janela
          );


        var janelaB =
          horarioParaData(
            b.janela
          );


        if(
          janelaA
          &&
          janelaB
        ){

          return (
            janelaA.getTime()
            -
            janelaB.getTime()
          );

        }


        return 0;

      }

    );


    html += `

    <div class="section">

      <div class="section-title">
        ${nomeSecao}
      </div>

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>TRANSPORTADORA</th>

              <th>OPERAÇÃO</th>

              <th>VEÍCULO</th>

              <th>JANELA</th>

              <th>PESO (KG)</th>

              <th>STATUS</th>

              <th>TEMPO</th>

              <th>CHEGADA</th>

              <th>INÍCIO CARR.</th>

              <th>FIM CARR.</th>

            </tr>

          </thead>

          <tbody>

    `;


    for(
      var j = 0;
      j < itens.length;
      j++
    ){


      var item =
        itens[j];


      var classe =
        classeStatus(
          item.status
        );


      var statusTexto =
        statusEmoticon(
          item.status
        );


      var tempo =
        calcularTempo(
          item
        );


      html += `

      <tr class="${classe}">

        <td>
          ${item.transportadora}
        </td>

        <td>
          ${item.operacao}
        </td>

        <td>
          ${item.veiculo}
        </td>

        <td class="janela">
          ${item.janela}
        </td>

        <td>
          ${item.peso}
        </td>

        <td>
          ${statusTexto}
        </td>

        <td class="${tempo.classe}">
          ${tempo.texto}
        </td>

        <td class="horario">
          ${item.chegada}
        </td>

        <td class="horario">
          ${item.inicio}
        </td>

        <td class="horario">
          ${item.fim}
        </td>

      </tr>

      `;

    }


    html += `

          </tbody>

        </table>

      </div>

    </div>

    `;

  }


  document
    .getElementById(
      "conteudo"
    )
    .innerHTML =
    html;

}


/* ==================================================
   INICIALIZAÇÃO
================================================== */

carregarDados();

carregarNFs();


/* ==================================================
   ATUALIZA PLANILHA A CADA 30 SEGUNDOS
================================================== */

setInterval(
  carregarDados,
  30000
);


setInterval(
  carregarNFs,
  30000
);


/* ==================================================
   RECALCULA OS TEMPOS A CADA 1 MINUTO

   NÃO PRECISA BUSCAR GOOGLE SHEETS NOVAMENTE.
================================================== */

setInterval(

  function(){

    if(
      dadosOperacao.length > 0
    ){

      renderizarPainel();

    }

  },

  60000

);


</script>
