<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERAÇÃO YUSEN - EXPEDIÇÃO</title>

<style>

body{
  margin:0;
  background:#001B5E;
  color:white;
  font-family:Arial, sans-serif;
  font-size:14px;
}

.header{
  background:#0B2F6F;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.header-logo{
  width:170px;
  height:auto;
  display:block;
  filter: none;
}

.header-text{
  flex:1;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:38px;
  letter-spacing:0.5px;
}

#relogio{
  margin-top:8px;
  font-size:20px;
  color:#EAF0FF;
}

.kpis{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
  flex-wrap:wrap;
}

.kpi{
  padding:12px 20px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
}

.kpi-atrasado{
  background:#D32F2F;
}

.kpi-carregamento{
  background:#8E24AA;
}

.kpi-carregado{
  background:#2E7D32;
}

.kpi-aguardando{
  background:#2304DE;
  color:white;
}

.kpi-patio{
  background:#FFC107;
  color:black;
}

.section{
  margin:20px;
}

.section-title{
  background:#FFC107;
  color:black;
  padding:10px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  border-radius:8px 8px 0 0;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#FFC107;
  color:black;
  padding:14px;
  font-size:22px;
  font-weight:bold;
}

td{
  padding:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.atrasado{
  background:#D32F2F;
}

.emcarregamento{
  background:#8E24AA;
  color:white;
}

.carregado{
  background:#0BF311;
}

.aguardando{
  background:#0000CC;
}

.patio{
  background:#E8FA04;
  color:black;
}

.footer{
  text-align:center;
  padding:20px;
  font-size:16px;
  color:#ddd;
}

</style>

</head>

<body>

<div class="header">
  <img
    src="https://vectorez.biz.id/wp-content/uploads/2023/10/Logo-Yusen-Logistik-1.png"
    alt="Yusen Logistik"
    class="header-logo"
  >

  <div class="header-text">
    <h1>OPERAÇÃO YUSEN - EXPEDIÇÃO</h1>
    <div id="relogio"></div>
  </div>
</div>

<div class="kpis" id="painelKpi"></div>

<div id="conteudo"></div>

<div class="footer">
  Atualização automática a cada 30 segundos
</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";

function atualizarRelogio(){

  const agora = new Date();

  document.getElementById("relogio").innerHTML =
    agora.toLocaleDateString('pt-BR')
    + " - " +
    agora.toLocaleTimeString('pt-BR');
}

setInterval(atualizarRelogio,1000);
atualizarRelogio();

async function carregarDados(){

  const resposta = await fetch(csvUrl);
  const texto = await resposta.text();

  const linhas = texto.split("\n");

  let html = "";

  let atrasados = 0;
  let carregamento = 0;
  let carregados = 0;
  let aguardando = 0;
  let patio = 0;

  let tabelaAberta = false;
  let secaoAtual = "";

  for(let i=0;i<linhas.length;i++){

    let colunas = linhas[i]
      .split(",")
      .map(x=>x.replace(/"/g,"").trim());

    if(colunas[0] === "ENERGY" || colunas[0] === "AUTOMOTIVO"){

      secaoAtual = colunas[0];

      if(tabelaAberta){
        html += "</table></div>";
      }

      html += `
      <div class="section">
      <div class="section-title">${colunas[0]}</div>

      <table>

      <tr>
      <th>TRANSPORTADORA</th>
      <th>VEÍCULO</th>
      <th>JANELA</th>
      `;

      if(secaoAtual === "ENERGY"){
        html += "<th>PESO</th>";
      }

      html += `
      <th>STATUS</th>
      </tr>
      `;

      tabelaAberta=true;
      continue;
    }

    if(
      colunas[0] &&
      colunas[0] !== "TRANSPORTADORA" &&
      colunas[0] !== "OPERAÇÃO YUSEN - EXPEDIÇÃO PANASONIC SJC"
    ){

      let status = "";
      let peso = "";

      if(secaoAtual === "ENERGY"){
        status = (colunas[4] || "").toUpperCase();
        peso = colunas[3] || "";
      } else {
        status = (colunas[3] || "").toUpperCase();
      }

      let classe = "";

      if(status.includes("ATRASADO")){
        classe = "atrasado";
        atrasados++;
      }

      else if(
        status.includes("CARREGANDO") ||
        status.includes("CARREGAMENTO")
      ){
        classe = "emcarregamento";
        carregamento++;
      }

      else if(
        status.includes("CARREGADO") ||
        status.includes("FINALIZADO")
      ){
        classe = "carregado";
        carregados++;
      }

      else if(
        status.includes("AGUARDANDO") ||
        status.includes("AGUARDANDO O VEICULO")
      ){
        classe = "aguardando";
        aguardando++;
      }

      else if(
        status.includes("PATIO") ||
        status.includes("NO PATIO")
      ){
        classe = "patio";
        patio++;
      }

      html += `
      <tr class="${classe}">
      <td>${colunas[0]}</td>
      <td>${colunas[1] || ""}</td>
      <td>${colunas[2] || ""}</td>
      `;

      if(secaoAtual === "ENERGY"){
        html += `<td>${peso}</td>`;
      }

      html += `
      <td>${secaoAtual === "ENERGY" ? (colunas[4] || "") : (colunas[3] || "")}</td>
      </tr>
      `;
    }
  }

  if(tabelaAberta){
    html += "</table></div>";
  }

  document.getElementById("conteudo").innerHTML = html;

  document.getElementById("painelKpi").innerHTML = `

  <div class="kpi kpi-aguardando">
  🚚 AGUARDANDO VEÍCULO: ${aguardando}
  </div>

  <div class="kpi kpi-atrasado">
  🚨 ATRASADOS: ${atrasados}
  </div>

  <div class="kpi kpi-patio">
  🏭 NO PÁTIO: ${patio}
  </div>

  <div class="kpi kpi-carregamento">
  📦 CARREGANDO: ${carregamento}
  </div>

  <div class="kpi kpi-carregado">
  ✅ CARREGADOS: ${carregados}
  </div>

  `;
}

carregarDados();

setInterval(carregarDados,30000);

</script>

</body>
</html>
