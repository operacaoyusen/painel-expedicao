<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OPERAÇÃO YUSEN - PANASONIC SJC</title>

<style>

:root{
--bg:#0b2441;
--line:rgba(255,255,255,0.12);
--text:#edf4ff;
--muted:#dfeafc;

--yellow:#f6d34c;
--yellow-strong:#e8c33b;

--purple:#9d69ff;
--purple-strong:#7c4ee4;

--green:#34d38f;
--green-strong:#20a86c;

--orange:#ff9f1c;
--orange-strong:#e67e00;

--shadow:0 14px 32px rgba(0,0,0,0.28);
}

*{
box-sizing:border-box;
}

body{

margin:0;

zoom:.90;

background:
radial-gradient(
circle at top,
rgba(76,132,214,0.28),
transparent 35%
),

linear-gradient(
180deg,
#0b2441 0%,
#050f1d 100%
);

color:var(--text);

font-family:Arial,sans-serif;

}

.header{

background:
linear-gradient(
90deg,
#0d3d68 0%,
#0f4d7c 35%,
#0a2d49 100%
);

padding:12px;

display:flex;

align-items:center;

justify-content:center;

border-bottom:1px solid var(--line);

box-shadow:var(--shadow);

min-height:80px;
}

.header-text{

width:100%;

text-align:center;

}

.header h1{

margin:0;

font-size:26px;

letter-spacing:.5px;

font-weight:700;

text-transform:uppercase;

}

#relogio{

margin-top:4px;

font-size:15px;

color:var(--muted);

font-weight:600;

}

.ticker{

width:100%;

height:55px;

background:
linear-gradient(
90deg,
#081421,
#111d29,
#081421
);

border-bottom:
2px solid var(--yellow);

align-items:center;

overflow:hidden;

box-shadow:
0 6px 18px rgba(0,0,0,.30);

}

.ticker-label{

height:100%;

min-width:210px;

padding:0 20px;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(
135deg,
var(--yellow),
var(--yellow-strong)
);

color:#111827;

font-size:18px;

font-weight:900;

}

.ticker-area{

position:relative;

flex:1;

overflow:hidden;

height:100%;

display:flex;

align-items:center;
}

.ticker-content{

position:absolute;

white-space:nowrap;

left:100%;

font-size:18px;

font-weight:900;

color:#fff;

animation:
tickerMovimento 15s linear infinite;

}

@keyframes tickerMovimento{

from{
transform:translateX(0);
}

to{
transform:translateX(-350%);
}

}

.kpis{

display:flex;

justify-content:center;

gap:12px;

padding:12px;

flex-wrap:wrap;

}

.kpi{

min-width:150px;

padding:12px 14px;

border-radius:12px;

font-size:14px;

font-weight:800;

text-align:center;

box-shadow:var(--shadow);

text-transform:uppercase;

}

.kpi-atrasado{
background:linear-gradient(
135deg,
#ff4b5d,
#e22d42
);
}

.kpi-aguardando{
background:linear-gradient(
135deg,
#536475,
#344454
);
}

.kpi-patio{
background:linear-gradient(
135deg,
var(--orange),
var(--orange-strong)
);
color:#17130c;
}

.kpi-processo{
background:linear-gradient(
135deg,
var(--purple),
var(--purple-strong)
);
}

.kpi-finalizado{
background:linear-gradient(
135deg,
var(--green),
var(--green-strong)
);
}

.section{

margin:12px;

background:
rgba(13,28,44,.78);

border:1px solid var(--line);

border-radius:14px;

overflow:hidden;

box-shadow:var(--shadow);

}

.section-title{

background:
linear-gradient(
90deg,
var(--yellow),
var(--yellow-strong)
);

color:#0f172a;

padding:8px;

text-align:center;

font-size:18px;

font-weight:900;

}

.table-container{

width:100%;

overflow-x:auto;

}

table{

width:100%;

border-collapse:collapse;

table-layout:fixed;

}

th{

background:
rgba(20,23,28,.95);

color:var(--yellow);

padding:8px 5px;

font-size:14px;

font-weight:700;

text-transform:uppercase;

border-bottom:
1px solid var(--line);

}

td{

padding:8px 5px;

text-align:center;

font-size:18px;

font-weight:800;

border-bottom:
1px solid rgba(255,255,255,.06);

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

}
tr.atrasado td{

background:
rgba(103,15,29,.90);

color:#fff3f5;

font-weight:900;

}

tr.aguardando td{

background:
rgba(50,65,80,.78);

color:#edf4ff;

}

tr.patio td{

background:
rgba(116,76,13,.87);

color:#fff6d8;

}

tr.processo td{

background:
rgba(75,46,122,.82);

color:#f2ebff;

}

tr.finalizado td{

background:
rgba(20,77,58,.85);

color:#ebfff5;

}

.janela{

color:#ff6874;

font-weight:900;

}

.horario{

font-weight:900;

}

.footer{

text-align:center;

padding:12px;

font-size:13px;

color:var(--muted);

}

@media(max-width:1100px){

th{
font-size:10px;
}

td{
font-size:11px;
}

}

</style>

</head>

<body>

<div class="header">

<div class="header-text">

<h1>
OPERAÇÃO YUSEN - PANASONIC SJC
</h1>

<div id="relogio"></div>

</div>

</div>

<div
class="ticker"
id="tickerContainer"
style="display:none;"
>

<div class="ticker-label">

📌 PIN PENDENTE

</div>

<div class="ticker-area">

<div
class="ticker-content"
id="tickerNFs">
</div>

</div>

</div>

<div
class="kpis"
id="painelKpi">
</div>

<div id="conteudo"></div>

<div class="footer">

Atualização automática a cada 30 segundos

</div>

<script>

var csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";

var csvNFs =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=141918402&single=true&output=csv";

function atualizarRelogio(){

var agora =
new Date();

document
.getElementById("relogio")
.innerHTML =

agora.toLocaleDateString("pt-BR")

+

" - "

+

agora.toLocaleTimeString("pt-BR");

}

setInterval(
atualizarRelogio,
1000
);

atualizarRelogio();

function normalizarStatus(status){

return (
status || ""
)
.trim()
.toUpperCase();

}

function statusEmoticon(status){

var s =
normalizarStatus(status);

if(s.indexOf("ATRASADO")!==-1)
return "🚨 ATRASADO";

if(s.indexOf("AGUARDANDO")!==-1)
return "⏳ AGUARDANDO";

if(
s.indexOf("NO PATIO")!==-1
||
s.indexOf("NO PÁTIO")!==-1
)
return "🚚 NO PATIO";

if(s.indexOf("EM PROCESSO")!==-1)
return "📦 EM PROCESSO";

if(s.indexOf("FINALIZADO")!==-1)
return "✅ FINALIZADO";

return status;

}

function classeStatus(status){

var s =
normalizarStatus(status);

if(s.indexOf("ATRASADO")!==-1)
return "atrasado";

if(
s.indexOf("NO PATIO")!==-1
||
s.indexOf("NO PÁTIO")!==-1
)
return "patio";

if(s.indexOf("EM PROCESSO")!==-1)
return "processo";

if(s.indexOf("AGUARDANDO")!==-1)
return "aguardando";

if(s.indexOf("FINALIZADO")!==-1)
return "finalizado";

return "";

}

function prioridadeStatus(status){

var s =
normalizarStatus(status);

if(s.indexOf("ATRASADO")!==-1)
return 1;

if(
s.indexOf("NO PATIO")!==-1
||
s.indexOf("NO PÁTIO")!==-1
)
return 2;

if(s.indexOf("EM PROCESSO")!==-1)
return 3;

if(s.indexOf("AGUARDANDO")!==-1)
return 4;

if(s.indexOf("FINALIZADO")!==-1)
return 5;

return 6;

}
async function carregarNFs(){

try{

var resposta =
await fetch(

csvNFs +

"&t=" +

new Date().getTime()

);

var texto =
await resposta.text();

var linhas =
texto
.replace(/\r/g,"")
.split("\n");

var nfs = [];

for(
var i = 1;
i < linhas.length;
i++
){

var nf =
linhas[i]
.split(",")[0]
.replace(/"/g,"")
.trim();

if(
nf !== ""
){

nfs.push(nf);

}

}

var container =
document
.getElementById(
"tickerContainer"
);

var ticker =
document
.getElementById(
"tickerNFs"
);

if(
nfs.length > 0
){

var textoTicker =

nfs

.map(

function(nf){

return "📄 NF " + nf;

}

)

.join(
" ◆ "
);

ticker.innerHTML =
textoTicker;

container.style.display =
"flex";

}

else{

ticker.innerHTML =
"";

container.style.display =
"none";

}

}

catch(erro){

document
.getElementById(
"tickerContainer"
)
.style.display =
"none";

}

}

var dadosOperacao = [];

async function carregarDados(){

try{

var resposta =
await fetch(

csvUrl +

"&t=" +

new Date().getTime()

);

var texto =
await resposta.text();

var linhas =
texto
.replace(/\r/g,"")
.split("\n");

dadosOperacao = [];

var secaoAtual =
"";

for(
var i = 0;
i < linhas.length;
i++
){

var colunas =
linhas[i]
.split(",")

.map(

function(x){

return x
.replace(/^"|"$/g,"")
.trim();

}

);

var primeira =

(
colunas[0]
||
""
)

.trim()
.toUpperCase();

if(
primeira === "ENERGY"
||
primeira === "AUTOMOTIVO"
){

secaoAtual =
primeira;

continue;

}

if(
primeira ===
"TRANSPORTADORA"
){

continue;

}

if(
!primeira
){

continue;

}

if(
!secaoAtual
){

continue;

}

dadosOperacao.push({

secao:
secaoAtual,

transportadora:
colunas[0] || "",

operacao:
colunas[1] || "",

veiculo:
colunas[2] || "",

janela:
colunas[3] || "",

peso:
colunas[4] || "",

status:
colunas[5] || "",

chegada:
colunas[6] || "",

inicio:
colunas[7] || "",

fim:
colunas[8] || ""

});

}

renderizarPainel();

}

catch(erro){

document
.getElementById(
"conteudo"
)
.innerHTML =

"<div style='margin:20px;padding:20px;background:#7a1724;color:#fff;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;'>⚠️ Erro ao carregar os dados.</div>";

}

}
function renderizarPainel(){

var atrasados = 0;
var aguardando = 0;
var noPatio = 0;
var emProcesso = 0;
var finalizados = 0;

for(
var i = 0;
i < dadosOperacao.length;
i++
){

var s =
normalizarStatus(
dadosOperacao[i].status
);

if(
s.indexOf("ATRASADO") !== -1
){

atrasados++;

}

else if(

s.indexOf("NO PATIO") !== -1
||
s.indexOf("NO PÁTIO") !== -1

){

noPatio++;

}

else if(
s.indexOf("EM PROCESSO") !== -1
){

emProcesso++;

}

else if(
s.indexOf("AGUARDANDO") !== -1
){

aguardando++;

}

else if(
s.indexOf("FINALIZADO") !== -1
){

finalizados++;

}

}

document
.getElementById(
"painelKpi"
)
.innerHTML = `

<div class="kpi kpi-atrasado">
🚨 ATRASADOS:
${atrasados}
</div>

<div class="kpi kpi-aguardando">
⏳ AGUARDANDO:
${aguardando}
</div>

<div class="kpi kpi-patio">
🚚 NO PATIO:
${noPatio}
</div>

<div class="kpi kpi-processo">
📦 EM PROCESSO:
${emProcesso}
</div>

<div class="kpi kpi-finalizado">
✅ FINALIZADOS:
${finalizados}
</div>

`;

var secoes = [
"ENERGY",
"AUTOMOTIVO"
];

var html = "";

for(
var s = 0;
s < secoes.length;
s++
){

var nomeSecao =
secoes[s];

var itens =

dadosOperacao.filter(

function(item){

return (
item.secao === nomeSecao
);

}

);

if(
itens.length === 0
){

continue;

}

itens.sort(

function(a,b){

var prioridadeA =
prioridadeStatus(
a.status
);

var prioridadeB =
prioridadeStatus(
b.status
);

if(
prioridadeA !== prioridadeB
){

return (
prioridadeA
-
prioridadeB
);

}

return 0;

}

);

html += `

<div class="section">

<div class="section-title">
${nomeSecao}
</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>TRANSPORTADORA</th>

<th>OPERAÇÃO</th>

<th>VEÍCULO</th>

<th>JANELA</th>

<th>PESO (KG)</th>

<th>STATUS</th>

<th>CHEGADA</th>

<th>INÍCIO CARR.</th>

<th>FIM CARR.</th>

</tr>

</thead>

<tbody>

`;

for(
var j = 0;
j < itens.length;
j++
){

var item =
itens[j];

var classe =
classeStatus(
item.status
);

var statusTexto =
statusEmoticon(
item.status
);

html += `

<tr class="${classe}">

<td>
${item.transportadora}
</td>

<td>
${item.operacao}
</td>

<td>
${item.veiculo}
</td>

<td class="janela">
${item.janela}
</td>

<td>
${item.peso}
</td>

<td>
${statusTexto}
</td>

<td class="horario">
${item.chegada}
</td>

<td class="horario">
${item.inicio}
</td>

<td class="horario">
${item.fim}
</td>

</tr>

`;

}

html += `

</tbody>

</table>

</div>

</div>

`;

}

document
.getElementById(
"conteudo"
)
.innerHTML =
html;

}

carregarDados();

carregarNFs();

setInterval(
carregarDados,
30000
);

setInterval(
carregarNFs,
30000
);
</script>

</body>

</html>
