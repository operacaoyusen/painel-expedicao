<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OPERAÇÃO YUSEN - PANASONIC SJC</title>

<style>

:root{

  --bg:#0b2441;

  --header:linear-gradient(
    90deg,
    #0d3d68 0%,
    #0f4d7c 35%,
    #0a2d49 100%
  );

  --line:rgba(255,255,255,0.12);

  --text:#edf4ff;

  --muted:#dfeafc;

  --yellow:#f6d34c;

  --yellow-strong:#e8c33b;

  --purple:#9d69ff;

  --purple-strong:#7c4ee4;

  --green:#34d38f;

  --green-strong:#20a86c;

  --orange:#ff9f1c;

  --orange-strong:#e67e00;

  --shadow:
    0 14px 32px
    rgba(0,0,0,0.28);

}


*{

  box-sizing:border-box;

}


body{

  margin:0;

  background:

    radial-gradient(
      circle at top,
      rgba(76,132,214,0.28),
      transparent 35%
    ),

    linear-gradient(
      180deg,
      var(--bg) 0%,
      #050f1d 100%
    );

  color:var(--text);

  font-family:
    Arial,
    sans-serif;

}



/* ==================================================
   CABEÇALHO
================================================== */


.header{

  background:
    var(--header);

  padding:20px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-bottom:
    1px solid
    var(--line);

  box-shadow:
    var(--shadow);

  min-height:105px;

}


.header-text{

  width:100%;

  text-align:center;

}


.header h1{

  margin:0;

  font-size:32px;

  letter-spacing:0.5px;

  font-weight:700;

  text-transform:uppercase;

  text-shadow:
    0 3px 10px
    rgba(0,0,0,0.28);

}


#relogio{

  margin-top:6px;

  font-size:18px;

  color:
    var(--muted);

  letter-spacing:0.5px;

  font-weight:600;

}



/* ==================================================
   KPIs
================================================== */


.kpis{

  display:flex;

  justify-content:center;

  gap:16px;

  padding:
    18px 20px 8px;

  flex-wrap:wrap;

}


.kpi{

  min-width:180px;

  padding:
    15px 18px;

  border-radius:14px;

  font-size:17px;

  font-weight:800;

  letter-spacing:0.3px;

  text-align:center;

  box-shadow:
    var(--shadow);

  border:
    1px solid
    rgba(255,255,255,0.08);

  text-transform:uppercase;

}



/* PENDENTE */

.kpi-pendente{

  background:

    linear-gradient(
      135deg,
      #536475,
      #344454
    );

}



/* ATRASADO */

.kpi-atrasado{

  background:

    linear-gradient(
      135deg,
      #ff4b5d 0%,
      #e22d42 100%
    );

  box-shadow:

    0 0 20px
    rgba(255,75,93,0.50),

    var(--shadow);

  animation:
    pulse-alert 2s infinite;

  color:white;

}


@keyframes pulse-alert{

  0%,
  100%{

    transform:scale(1);

  }

  50%{

    transform:scale(1.04);

  }

}



/* AGUARDANDO */

.kpi-aguardando{

  background:

    linear-gradient(
      135deg,
      var(--orange),
      var(--orange-strong)
    );

  color:#161616;

}



/* CARREGANDO */

.kpi-carregamento{

  background:

    linear-gradient(
      135deg,
      var(--purple),
      var(--purple-strong)
    );

}



/* CARREGADO */

.kpi-carregado{

  background:

    linear-gradient(
      135deg,
      var(--green),
      var(--green-strong)
    );

}



/* ==================================================
   SEÇÕES
================================================== */


.section{

  margin:
    20px 18px 10px;

  background:
    rgba(13,28,44,0.78);

  border:
    1px solid
    var(--line);

  border-radius:14px;

  overflow:hidden;

  box-shadow:
    var(--shadow);

}


.section-title{

  background:

    linear-gradient(
      90deg,
      var(--yellow),
      var(--yellow-strong)
    );

  color:#0f172a;

  padding:
    11px 20px;

  text-align:center;

  font-size:23px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;

}



/* ==================================================
   TABELA
================================================== */


.table-container{

  width:100%;

  overflow-x:auto;

}


table{

  width:100%;

  border-collapse:collapse;

  table-layout:auto;

}


th{

  background:
    rgba(20,23,28,0.95);

  color:
    var(--yellow);

  padding:
    12px 8px;

  font-size:15px;

  font-weight:800;

  text-transform:uppercase;

  border-bottom:
    1px solid
    var(--line);

  white-space:nowrap;

}


td{

  padding:
    12px 8px;

  text-align:center;

  font-size:17px;

  font-weight:700;

  border-bottom:
    1px solid
    rgba(255,255,255,0.06);

  background:
    rgba(255,255,255,0.03);

  color:#f4f8ff;

  white-space:nowrap;

}


tr:last-child td{

  border-bottom:none;

}



/* ==================================================
   COLUNAS ESPECÍFICAS
================================================== */


.col-transportadora{

  min-width:155px;

}


.col-operacao{

  min-width:110px;

}


.col-veiculo{

  min-width:110px;

}


.col-janela{

  min-width:90px;

}


.col-peso{

  min-width:100px;

}


.col-status{

  min-width:150px;

}


.col-horario{

  min-width:110px;

}



/* ==================================================
   STATUS DAS LINHAS
================================================== */


/* PENDENTE */


tr.pendente td{

  background:
    rgba(50,65,80,0.72)
    !important;

  color:
    #edf4ff
    !important;

}



/* ATRASADO */


tr.atrasado td{

  background:
    rgba(103,15,29,0.90)
    !important;

  color:
    #fff3f5
    !important;

  font-weight:900;

  text-shadow:

    0 0 10px
    rgba(255,93,108,0.45);

}



/* AGUARDANDO */


tr.aguardando td{

  background:
    rgba(116,76,13,0.87)
    !important;

  color:
    #fff6d8
    !important;

}



/* CARREGANDO */


tr.emcarregamento td{

  background:
    rgba(75,46,122,0.82)
    !important;

  color:
    #f2ebff
    !important;

}



/* CARREGADO */


tr.carregado td{

  background:
    rgba(20,77,58,0.85)
    !important;

  color:
    #ebfff5
    !important;

}



/* ==================================================
   DESTAQUE NOS HORÁRIOS
================================================== */


.horario{

  font-weight:900;

  font-size:18px;

}


.janela{

  color:#ff6874;

  font-weight:900;

}



/* ==================================================
   RODAPÉ
================================================== */


.footer{

  text-align:center;

  padding:
    18px 20px 28px;

  font-size:14px;

  color:
    var(--muted);

  letter-spacing:0.4px;

}



/* ==================================================
   RESPONSIVO
================================================== */


@media(max-width:1100px){

  th{

    font-size:12px;

  }

  td{

    font-size:14px;

  }

}


@media(max-width:900px){

  .header{

    padding:
      18px 10px;

  }

  .header h1{

    font-size:25px;

  }

  #relogio{

    font-size:15px;

  }

  .kpi{

    min-width:150px;

    font-size:13px;

  }

}

</style>

</head>


<body>


<!-- ==================================================
     CABEÇALHO
================================================== -->


<div class="header">

  <div class="header-text">

    <h1>
      OPERAÇÃO YUSEN - PANASONIC SJC
    </h1>

    <div id="relogio"></div>

  </div>

</div>



<!-- ==================================================
     KPIs
================================================== -->


<div
  class="kpis"
  id="painelKpi">
</div>



<!-- ==================================================
     TABELAS
================================================== -->


<div id="conteudo"></div>



<!-- ==================================================
     RODAPÉ
================================================== -->


<div class="footer">

  Atualização automática a cada 30 segundos

</div>



<script>


/* ==================================================
   GOOGLE SHEETS
================================================== */


const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";



/* ==================================================
   RELÓGIO
================================================== */


function atualizarRelogio(){

  const agora =
    new Date();


  document
    .getElementById("relogio")
    .innerHTML =

    agora.toLocaleDateString(
      "pt-BR"
    )

    +

    " - "

    +

    agora.toLocaleTimeString(
      "pt-BR"
    );

}


setInterval(
  atualizarRelogio,
  1000
);


atualizarRelogio();



/* ==================================================
   STATUS COM ÍCONES
================================================== */


function statusEmoticon(status){

  const s =
    (status || "")
    .trim()
    .toUpperCase();


  if(
    s.includes("ATRASADO")
  ){

    return "🚨 ATRASADO";

  }


  if(
    s.includes("PENDENTE")
  ){

    return "⏳ PENDENTE";

  }


  if(
    s.includes("AGUARDANDO")
  ){

    return "🚚 AGUARDANDO";

  }


  if(
    s.includes("CARREGANDO")
    ||
    s.includes("CARREGAMENTO")
  ){

    return "📦 CARREGANDO";

  }


  if(
    s.includes("CARREGADO")
    ||
    s.includes("FINALIZADO")
  ){

    return "✅ CARREGADO";

  }


  return status || "";

}



/* ==================================================
   DESCOBRE A CLASSE DO STATUS
================================================== */


function classeStatus(status){

  const s =
    (status || "")
    .trim()
    .toUpperCase();


  if(
    s.includes("ATRASADO")
  ){

    return "atrasado";

  }


  if(
    s.includes("PENDENTE")
  ){

    return "pendente";

  }


  if(
    s.includes("AGUARDANDO")
  ){

    return "aguardando";

  }


  if(
    s.includes("CARREGANDO")
    ||
    s.includes("CARREGAMENTO")
  ){

    return "emcarregamento";

  }


  if(
    s.includes("CARREGADO")
    ||
    s.includes("FINALIZADO")
  ){

    return "carregado";

  }


  return "";

}



/* ==================================================
   CARREGAR DADOS
================================================== */


async function carregarDados(){

  try{


    const resposta =
      await fetch(
        csvUrl +
        "&t=" +
        new Date().getTime()
      );


    if(
      !resposta.ok
    ){

      throw new Error(
        "Erro HTTP: " +
        resposta.status
      );

    }


    const texto =
      await resposta.text();


    const linhas =
      texto
      .replace(/\r/g,"")
      .split("\n");


    let html = "";


    let secaoAtual = "";


    let tabelaAberta = false;


    /* CONTADORES */

    let pendentes = 0;

    let atrasados = 0;

    let aguardando = 0;

    let carregando = 0;

    let carregados = 0;



    /* ==================================================
       PERCORRE PLANILHA
    ================================================== */


    for(
      let i = 0;
      i < linhas.length;
      i++
    ){


      let colunas =
        linhas[i]

        .split(",")

        .map(

          x =>

            x
            .replace(/^"|"$/g,"")
            .trim()

        );


      const primeiraColuna =
        (
          colunas[0]
          ||
          ""
        )
        .trim()
        .toUpperCase();



      /* ==================================================
         IDENTIFICA ENERGY / AUTOMOTIVO
      ================================================== */


      if(
        primeiraColuna === "ENERGY"
        ||
        primeiraColuna === "AUTOMOTIVO"
      ){


        if(
          tabelaAberta
        ){

          html +=
            "</table></div></div>";

        }


        secaoAtual =
          primeiraColuna;


        html += `

        <div class="section">

          <div class="section-title">

            ${secaoAtual}

          </div>


          <div class="table-container">


          <table>


            <thead>

              <tr>

                <th class="col-transportadora">
                  TRANSPORTADORA
                </th>

                <th class="col-operacao">
                  OPERAÇÃO
                </th>

                <th class="col-veiculo">
                  VEÍCULO
                </th>

                <th class="col-janela">
                  JANELA
                </th>

                <th class="col-peso">
                  PESO (KG)
                </th>

                <th class="col-status">
                  STATUS
                </th>

                <th class="col-horario">
                  CHEGADA
                </th>

                <th class="col-horario">
                  INÍCIO CARR.
                </th>

                <th class="col-horario">
                  FIM CARR.
                </th>

              </tr>

            </thead>


            <tbody>

        `;


        tabelaAberta =
          true;


        continue;

      }



      /* ==================================================
         IGNORA CABEÇALHOS DA PLANILHA
      ================================================== */


      if(
        primeiraColuna ===
        "TRANSPORTADORA"
      ){

        continue;

      }



      /* ==================================================
         IGNORA LINHAS VAZIAS
      ================================================== */


      if(
        !primeiraColuna
      ){

        continue;

      }



      /* ==================================================
         SÓ PROCESSA QUANDO JÁ ENCONTROU UMA SEÇÃO
      ================================================== */


      if(
        !secaoAtual
      ){

        continue;

      }



      /* ==================================================
         NOVA ESTRUTURA DA PLANILHA

         A = TRANSPORTADORA
         B = OPERAÇÃO
         C = VEÍCULO
         D = JANELA
         E = PESO
         F = STATUS
         G = CHEGADA
         H = INÍCIO CARR.
         I = FIM CARR.
      ================================================== */


      const transportadora =
        colunas[0] || "";


      const operacao =
        colunas[1] || "";


      const veiculo =
        colunas[2] || "";


      const janela =
        colunas[3] || "";


      const peso =
        colunas[4] || "";


      const statusRaw =
        colunas[5] || "";


      const chegada =
        colunas[6] || "";


      const inicio =
        colunas[7] || "";


      const fim =
        colunas[8] || "";



      /* ==================================================
         IDENTIFICA STATUS
      ================================================== */


      const status =
        statusRaw
        .trim()
        .toUpperCase();


      const classe =
        classeStatus(
          status
        );



      /* ==================================================
         CONTADORES
      ================================================== */


      if(
        status.includes("ATRASADO")
      ){

        atrasados++;

      }


      else if(
        status.includes("PENDENTE")
      ){

        pendentes++;

      }


      else if(
        status.includes("AGUARDANDO")
      ){

        aguardando++;

      }


      else if(

        status.includes("CARREGANDO")
        ||
        status.includes("CARREGAMENTO")

      ){

        carregando++;

      }


      else if(

        status.includes("CARREGADO")
        ||
        status.includes("FINALIZADO")

      ){

        carregados++;

      }



      const statusTexto =
        statusEmoticon(
          statusRaw
        );



      /* ==================================================
         CRIA LINHA
      ================================================== */


      html += `

      <tr class="${classe}">


        <td>
          ${transportadora}
        </td>


        <td>
          ${operacao}
        </td>


        <td>
          ${veiculo}
        </td>


        <td class="janela">
          ${janela}
        </td>


        <td>
          ${peso}
        </td>


        <td>
          ${statusTexto}
        </td>


        <td class="horario">
          ${chegada}
        </td>


        <td class="horario">
          ${inicio}
        </td>


        <td class="horario">
          ${fim}
        </td>


      </tr>

      `;


    }



    /* ==================================================
       FECHA ÚLTIMA TABELA
    ================================================== */


    if(
      tabelaAberta
    ){

      html += `

          </tbody>

        </table>

        </div>

      </div>

      `;

    }



    /* ==================================================
       EXIBE TABELAS
    ================================================== */


    document
      .getElementById("conteudo")
      .innerHTML =
      html;



    /* ==================================================
       KPIs
    ================================================== */


    document
      .getElementById("painelKpi")
      .innerHTML = `


      <div class="kpi kpi-atrasado">

        🚨 ATRASADOS:
        ${atrasados}

      </div>


      <div class="kpi kpi-pendente">

        ⏳ PENDENTES:
        ${pendentes}

      </div>


      <div class="kpi kpi-aguardando">

        🚚 AGUARDANDO:
        ${aguardando}

      </div>


      <div class="kpi kpi-carregamento">

        📦 CARREGANDO:
        ${carregando}

      </div>


      <div class="kpi kpi-carregado">

        ✅ CARREGADOS:
        ${carregados}

      </div>


      `;


  }


  catch(erro){


    console.error(
      "Erro ao carregar dados:",
      erro
    );


    document
      .getElementById("conteudo")
      .innerHTML = `

      <div
        style="
          margin:20px;
          padding:20px;
          background:#7a1724;
          color:white;
          border-radius:12px;
          text-align:center;
          font-size:20px;
          font-weight:bold;
        "
      >

        ⚠️ Erro ao carregar os dados do painel.

      </div>

      `;

  }

}



/* ==================================================
   CARREGA AO ABRIR
================================================== */


carregarDados();



/* ==================================================
   ATUALIZAÇÃO AUTOMÁTICA
================================================== */


setInterval(
  carregarDados,
  30000
);


</script>


</body>

</html>
