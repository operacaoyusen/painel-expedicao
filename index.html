<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERAÇÃO YUSEN - EXPEDIÇÃO</title>

<style>

:root{
  --bg: #071b2d;
  --bg-2: #0d233f;
  --panel: rgba(10, 24, 42, 0.9);
  --panel-strong: #122c4a;
  --header: linear-gradient(90deg, #0f2d5c 0%, #0c2347 30%, #0b1e39 100%);
  --line: rgba(255,255,255,0.08);
  --text: #edf4ff;
  --muted: #bfd0ea;
  --yellow: #f5c451;
  --yellow-strong: #ffbf1f;
  --red: #ef4d5d;
  --red-strong: #d62b45;
  --purple: #8a5cf6;
  --purple-strong: #6d3eea;
  --green: #1fbf75;
  --green-strong: #10985d;
  --blue: #2f7ef7;
  --blue-strong: #1659d6;
  --patio: #d9d729;
  --patio-strong: #b8b61c;
  --shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
}

* { box-sizing: border-box; }

body{
  margin:0;
  background:
    radial-gradient(circle at top, rgba(35, 88, 155, 0.25), transparent 35%),
    linear-gradient(180deg, var(--bg) 0%, #050f1d 100%);
  color:var(--text);
  font-family:Arial, sans-serif;
  font-size:14px;
}

.header{
  background: var(--header);
  padding: 18px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.header-logo{
  width:170px;
  height:auto;
  display:block;
  filter: drop-shadow(0 6px 18px rgba(7, 15, 20, 0.35));
}

.header-text{
  flex:1;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:38px;
  letter-spacing:0.5px;
  font-weight:700;
  text-transform:uppercase;
  text-shadow: 0 3px 10px rgba(0,0,0,0.28);
}

#relogio{
  margin-top:8px;
  font-size:20px;
  color:var(--muted);
  letter-spacing:0.5px;
  font-weight:600;
}

.kpis{
  display:flex;
  justify-content:center;
  gap:18px;
  padding:18px 20px 8px;
  flex-wrap:wrap;
}

.kpi{
  min-width:200px;
  padding:16px 20px;
  border-radius:14px;
  font-size:18px;
  font-weight:700;
  letter-spacing:0.3px;
  box-shadow: var(--shadow);
  border:1px solid rgba(255,255,255,0.08);
  text-transform:uppercase;
}

.kpi-atrasado{ 
  background:linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
  box-shadow: 0 0 20px rgba(255, 68, 68, 0.5), var(--shadow);
  animation: pulse-alert 2s infinite;
  font-size: 20px;
  color: #fff;
}

@keyframes pulse-alert {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.kpi-carregamento{ background:linear-gradient(135deg, var(--purple) 0%, var(--purple-strong) 100%); }
.kpi-carregado{ background:linear-gradient(135deg, var(--green) 0%, var(--green-strong) 100%); }
.kpi-aguardando{ background:linear-gradient(135deg, var(--blue) 0%, var(--blue-strong) 100%); }
.kpi-patio{ background:linear-gradient(135deg, var(--patio) 0%, var(--patio-strong) 100%); color:#111; }

.section{
  margin:20px 18px 10px;
  background: rgba(10, 24, 42, 0.62);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow: var(--shadow);
}

.section-title{
  background:linear-gradient(90deg, var(--yellow) 0%, var(--yellow-strong) 100%);
  color:#0f172a;
  padding:14px 20px;
  text-align:center;
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead tr th:first-child,
tbody tr td:first-child{ border-left:none; }

th{
  background:rgba(255, 191, 31, 0.13);
  color:var(--yellow);
  padding:14px 12px;
  font-size:18px;
  font-weight:800;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
  letter-spacing:0.6px;
}

td{
  padding:14px 12px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.02);
}

tr:last-child td { border-bottom:none; }

.atrasado{ 
  background:rgba(255, 68, 68, 0.25) !important;
  color: #ff6b6b;
  font-weight: 900;
  box-shadow: inset 0 0 10px rgba(255, 68, 68, 0.3);
}

.emcarregamento{ background:rgba(138, 92, 246, 0.18); }
.carregado{ background:rgba(31, 191, 117, 0.15); }
.aguardando{ background:rgba(47, 126, 247, 0.18); }
.patio{ background:rgba(217, 215, 41, 0.18); color:#111; }

.footer{
  text-align:center;
  padding:18px 20px 28px;
  font-size:15px;
  color:var(--muted);
  letter-spacing:0.4px;
}

@media (max-width: 900px) {
  .header {
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .header-logo {
    width:120px;
  }

  .header h1 {
    font-size:28px;
  }

  th, td {
    font-size:14px;
    padding:10px 8px;
  }

  .kpi {
    min-width: 160px;
    font-size:14px;
  }
}

</style>

</head>

<body>

<div class="header">
  <img
    src="https://vectorez.biz.id/wp-content/uploads/2023/10/Logo-Yusen-Logistik-1.png"
    alt="Yusen Logistik"
    class="header-logo"
  >

  <div class="header-text">
    <h1>OPERAÇÃO YUSEN - EXPEDIÇÃO</h1>
    <div id="relogio"></div>
  </div>
</div>

<div class="kpis" id="painelKpi"></div>

<div id="conteudo"></div>

<div class="footer">
  Atualização automática a cada 30 segundos
</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";

function atualizarRelogio(){
  const agora = new Date();
  document.getElementById("relogio").innerHTML =
    agora.toLocaleDateString('pt-BR') + " - " + agora.toLocaleTimeString('pt-BR');
}

setInterval(atualizarRelogio,1000);
atualizarRelogio();

async function carregarDados(){

  const resposta = await fetch(csvUrl);
  const texto = await resposta.text();

  const linhas = texto.split("\n");

  let html = "";

  let atrasados = 0;
  let carregamento = 0;
  let carregados = 0;
  let aguardando = 0;
  let patio = 0;

  let tabelaAberta = false;
  let secaoAtual = "";

  for(let i=0;i<linhas.length;i++){

    let colunas = linhas[i]
      .split(",")
      .map(x => x.replace(/"/g, "").trim());

    if(colunas[0] === "ENERGY" || colunas[0] === "AUTOMOTIVO"){

      secaoAtual = colunas[0];

      if(tabelaAberta){
        html += "</table></div>";
      }

      html += `
      <div class="section">
      <div class="section-title">${colunas[0]}</div>

      <table>
      <tr>
      <th>TRANSPORTADORA</th>
      <th>VEÍCULO</th>
      <th>JANELA</th>
      ${secaoAtual === "ENERGY" ? "<th>PESO</th>" : ""}
      <th>STATUS</th>
      </tr>
      `;

      tabelaAberta = true;
      continue;
    }

    if(
      colunas[0] &&
      colunas[0] !== "TRANSPORTADORA" &&
      colunas[0] !== "OPERAÇÃO YUSEN - EXPEDIÇÃO PANASONIC SJC"
    ){

      let statusIndex = secaoAtual === "ENERGY" ? 4 : 3;
      let peso = "";

      if(secaoAtual === "AUTOMOTIVO" && colunas.length > 4){
        const valorQuarto = (colunas[3] || "").trim();
        const parecePeso = /^\d+[\.,]?\d*$/.test(valorQuarto.replace(/\s/g, ""));
        if(!parecePeso && (colunas[4] || "").trim()){
          statusIndex = 4;
        }
      }

      if(secaoAtual === "ENERGY"){
        peso = colunas[3] || "";
      }

      const status = (colunas[statusIndex] || "").toUpperCase();
      let classe = "";

      if(status.includes("ATRASADO")){
        classe = "atrasado";
        atrasados++;
      }

      else if(
        status.includes("CARREGANDO") ||
        status.includes("CARREGAMENTO")
      ){
        classe = "emcarregamento";
        carregamento++;
      }

      else if(
        status.includes("CARREGADO") ||
        status.includes("FINALIZADO")
      ){
        classe = "carregado";
        carregados++;
      }

      else if(
        status.includes("AGUARDANDO") ||
        status.includes("AGUARDANDO O VEICULO")
      ){
        classe = "aguardando";
        aguardando++;
      }

      else if(
        status.includes("PATIO") ||
        status.includes("NO PATIO")
      ){
        classe = "patio";
        patio++;
      }

      html += `
      <tr class="${classe}">
      <td>${colunas[0]}</td>
      <td>${colunas[1] || ""}</td>
      <td>${colunas[2] || ""}</td>
      ${secaoAtual === "ENERGY" ? `<td>${peso}</td>` : ""}
      <td>${colunas[statusIndex] || ""}</td>
      </tr>
      `;
    }
  }

  if(tabelaAberta){
    html += "</table></div>";
  }

  document.getElementById("conteudo").innerHTML = html;

  document.getElementById("painelKpi").innerHTML = `

  <div class="kpi kpi-aguardando">
  🚚 🚚 AGUARDANDO VEÍCULO: ${aguardando}
  </div>

  <div class="kpi kpi-atrasado">
  🚨 🚨 ATRASADOS: ${atrasados}
  </div>

  <div class="kpi kpi-patio">
  🏭 🏭 NO PÁTIO: ${patio}
  </div>

  <div class="kpi kpi-carregamento">
  📦 📦 CARREGANDO: ${carregamento}
  </div>

  <div class="kpi kpi-carregado">
  ✅ ✅ CARREGADOS: ${carregados}
  </div>

  `;
}

carregarDados();
setInterval(carregarDados,30000);

</script>

</body>
</html>
