<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<title>OPERAÇÃO YUSEN - EXPEDIÇÃO</title>

<style>

:root{
  --bg: #0b2441;
  --bg-2: #123b5f;
  --panel: rgba(14, 31, 52, 0.82);
  --panel-strong: #173f68;
  --header: linear-gradient(90deg, #0d3d68 0%, #0f4d7c 35%, #0a2d49 100%);
  --line: rgba(255,255,255,0.12);
  --text: #edf4ff;
  --muted: #dfeafc;
  --yellow: #f6d34c;
  --yellow-strong: #e8c33b;
  --red: #ff3b48;
  --red-strong: #d82b3b;
  --purple: #9d69ff;
  --purple-strong: #7c4ee4;
  --green: #34d38f;
  --green-strong: #20a86c;
  --blue: #51a6ff;
  --blue-strong: #2487e4;
  --patio: #f5d34d;
  --patio-strong: #d7b92f;
  --shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
}

* {
  box-sizing: border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top, rgba(76, 132, 214, 0.28), transparent 35%),
    linear-gradient(180deg, var(--bg) 0%, #050f1d 100%);
  color:var(--text);
  font-family:Arial, sans-serif;
  font-size:14px;
}

/* =========================
   CABEÇALHO
========================= */

.header{
  background: var(--header);
  padding: 12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
  min-height:110px;
}

.header-brand{
  width:220px;
  display:flex;
  align-items:center;
  flex-shrink:0;
}

.header-left{
  justify-content:flex-start;
}

.header-right{
  justify-content:flex-end;
}

.header-logo{
  width:150px;
  height:auto;
  display:block;
  filter:drop-shadow(0 6px 18px rgba(7,15,20,0.35));
}

.header-logo-right{
  width:200px;
  height:auto;
  display:block;
  object-fit:contain;
}

.header-text{
  flex:1;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:32px;
  letter-spacing:0.5px;
  font-weight:700;
  text-transform:uppercase;
  text-shadow:0 3px 10px rgba(0,0,0,0.28);
}

#relogio{
  margin-top:6px;
  font-size:18px;
  color:var(--muted);
  letter-spacing:0.5px;
  font-weight:600;
}


/* =========================
   KPIs
========================= */

.kpis{
  display:flex;
  justify-content:center;
  gap:18px;
  padding:18px 20px 8px;
  flex-wrap:wrap;
}

.kpi{
  min-width:200px;
  padding:16px 20px;
  border-radius:14px;
  font-size:18px;
  font-weight:700;
  letter-spacing:0.3px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,0.08);
  text-transform:uppercase;
}

.kpi-atrasado{ 
  background:linear-gradient(135deg, #ff4b5d 0%, #e22d42 100%);
  box-shadow:0 0 20px rgba(255,75,93,0.5), var(--shadow);
  animation:pulse-alert 2s infinite;
  font-size:20px;
  color:#fff;
}

@keyframes pulse-alert {
  0%, 100% {
    transform:scale(1);
  }

  50% {
    transform:scale(1.05);
  }
}

.kpi-carregamento{
  background:linear-gradient(135deg, var(--purple) 0%, var(--purple-strong) 100%);
}

.kpi-carregado{
  background:linear-gradient(135deg, var(--green) 0%, var(--green-strong) 100%);
}

.kpi-aguardando{
  background:linear-gradient(135deg, var(--patio) 0%, var(--patio-strong) 100%);
  color:#1f1b10;
}

.kpi-patio{
  background:linear-gradient(135deg, var(--patio) 0%, var(--patio-strong) 100%);
  color:#1f1b10;
}


/* =========================
   SEÇÕES
========================= */

.section{
  margin:20px 18px 10px;
  background:rgba(13,28,44,0.78);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.section-title{
  background:linear-gradient(90deg, var(--yellow) 0%, var(--yellow-strong) 100%);
  color:#0f172a;
  padding:14px 20px;
  text-align:center;
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}


/* =========================
   TABELA
========================= */

table{
  width:100%;
  border-collapse:collapse;
}

thead tr th:first-child,
tbody tr td:first-child{
  border-left:none;
}

th{
  background:rgba(20,23,28,0.9);
  color:var(--yellow);
  padding:14px 12px;
  font-size:18px;
  font-weight:800;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
  letter-spacing:0.6px;
}

td{
  padding:14px 12px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.03);
  color:#f4f8ff;
}

tr:last-child td{
  border-bottom:none;
}


/* =========================
   CORES DOS STATUS
========================= */

tr.atrasado td{
  background:rgba(103,15,29,0.9) !important;
  color:#fff3f5 !important;
  font-weight:900;
  text-shadow:0 0 10px rgba(255,93,108,0.45);
}

tr.emcarregamento td{
  background:rgba(75,46,122,0.82) !important;
  color:#f2ebff !important;
}

tr.carregado td{
  background:rgba(20,77,58,0.85) !important;
  color:#ebfff5 !important;
}

tr.aguardando td{
  background:rgba(118,104,26,0.85) !important;
  color:#fff9d9 !important;
}

tr.patio td{
  background:rgba(118,104,26,0.85) !important;
  color:#fff9d9 !important;
}


/* =========================
   RODAPÉ
========================= */

.footer{
  text-align:center;
  padding:18px 20px 28px;
  font-size:15px;
  color:var(--muted);
  letter-spacing:0.4px;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width:900px){

  .header{
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .header-brand{
    width:auto;
    justify-content:center;
  }

  .header-logo{
    width:120px;
  }

  .header-logo-right{
    width:180px;
  }

  .header h1{
    font-size:28px;
  }

  th,
  td{
    font-size:14px;
    padding:10px 8px;
  }

  .kpi{
    min-width:160px;
    font-size:14px;
  }
}

</style>

</head>
