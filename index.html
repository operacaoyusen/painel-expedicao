<script>

/* ==========================================
   BLOQUEIO POR SENHA
   ========================================== */

const SENHA =
"operacaoyusen";


function verificaSenha(){

const digitada =
document
.getElementById("inputSenha")
.value;


if(digitada === SENHA){

localStorage.setItem(
"acesso_yusen",
"liberado"
);

document
.getElementById(
"bloqueio-senha"
)
.style.display =
"none";

}

else{

document
.getElementById(
"erroSenha"
)
.style.display =
"block";

}

}


if(
localStorage.getItem(
"acesso_yusen"
)
===
"liberado"
){

document
.getElementById(
"bloqueio-senha"
)
.style.display =
"none";

}


document
.getElementById(
"inputSenha"
)
.addEventListener(
"keyup",
function(e){

if(e.key === "Enter"){

verificaSenha();

}

}
);


/* ==========================================
   GOOGLE SHEETS
   ========================================== */

var csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";

var csvNFs =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=141918402&single=true&output=csv";


/* ==========================================
   RELÓGIO
   ========================================== */

function atualizarRelogio(){

var agora =
new Date();

document
.getElementById(
"relogio"
)
.innerHTML =

agora.toLocaleDateString(
"pt-BR"
)

+

" - "

+

agora.toLocaleTimeString(
"pt-BR"
);

}


setInterval(
atualizarRelogio,
1000
);

atualizarRelogio();


/* ==========================================
   STATUS
   ========================================== */

function normalizarStatus(status){

return (
status || ""
)
.trim()
.toUpperCase();

}


function statusEmoticon(status){

var s =
normalizarStatus(status);


if(s.indexOf("ATRASADO") !== -1)
return "🚨 ATRASADO";


if(s.indexOf("AGUARDANDO") !== -1)
return "AGUARDANDO";


if(
s.indexOf("NO PATIO") !== -1
||
s.indexOf("NO PÁTIO") !== -1
)
return "NO PATIO";


if(s.indexOf("EM PROCESSO") !== -1)
return "EM PROCESSO";


if(s.indexOf("FINALIZADO") !== -1)
return "FINALIZADO";


return status;

}


function classeStatus(status){

var s =
normalizarStatus(status);


if(s.indexOf("ATRASADO") !== -1)
return "atrasado";


if(
s.indexOf("NO PATIO") !== -1
||
s.indexOf("NO PÁTIO") !== -1
)
return "patio";


if(s.indexOf("EM PROCESSO") !== -1)
return "processo";


if(s.indexOf("AGUARDANDO") !== -1)
return "aguardando";


if(s.indexOf("FINALIZADO") !== -1)
return "finalizado";


return "";

}


function prioridadeStatus(status){

var s =
normalizarStatus(status);


if(s.indexOf("ATRASADO") !== -1)
return 1;


if(
s.indexOf("NO PATIO") !== -1
||
s.indexOf("NO PÁTIO") !== -1
)
return 2;


if(s.indexOf("EM PROCESSO") !== -1)
return 3;


if(s.indexOf("AGUARDANDO") !== -1)
return 4;


if(s.indexOf("FINALIZADO") !== -1)
return 5;


return 6;

}


/* ==========================================
   TICKER DE NFs
   ========================================== */

async function carregarNFs(){

try{

var resposta =
await fetch(

csvNFs +

"&t=" +

new Date().getTime()

);


var texto =
await resposta.text();


var linhas =
texto
.replace(/\r/g,"")
.split("\n");


var nfs = [];


for(
var i = 1;
i < linhas.length;
i++
){

var nf =
linhas[i]
.split(",")[0]
.replace(/"/g,"")
.trim();


if(nf !== ""){

nfs.push(nf);

}

}


var container =
document
.getElementById(
"tickerContainer"
);


var ticker =
document
.getElementById(
"tickerNFs"
);


if(nfs.length > 0){

var textoTicker =

nfs

.map(

function(nf){

return "📄 NF " + nf;

}

)

.join(
" ◆ "
);


ticker.innerHTML =
textoTicker;


container.style.display =
"flex";

}

else{

ticker.innerHTML =
"";


container.style.display =
"none";

}

}

catch(erro){

document
.getElementById(
"tickerContainer"
)
.style.display =
"none";

}

}


/* ==========================================
   DADOS DA OPERAÇÃO
   ========================================== */

var dadosOperacao = [];


/* ==========================================
   CONVERSÃO DE HORÁRIO
   ========================================== */

function converterHorarioParaMinutos(
horario
){

if(!horario){

return null;

}


var texto =
String(horario)
.trim();


var resultado =
texto.match(
/(\d{1,2}):(\d{2})/
);


if(!resultado){

return null;

}


var hora =
parseInt(
resultado[1],
10
);


var minuto =
parseInt(
resultado[2],
10
);


if(
isNaN(hora)
||
isNaN(minuto)
||
hora < 0
||
hora > 23
||
minuto < 0
||
minuto > 59
){

return null;

}


return (
hora * 60 +
minuto
);

}


/* ==========================================
   PRIMEIRA JANELA DO DIA
   ========================================== */

function obterPrimeiraJanela(){

var menorHorario =
null;


for(
var i = 0;
i < dadosOperacao.length;
i++
){

var minutos =
converterHorarioParaMinutos(
dadosOperacao[i].janela
);


if(minutos === null){

continue;

}


if(
menorHorario === null
||
minutos < menorHorario
){

menorHorario =
minutos;

}

}


return menorHorario;

}


/* ==========================================
   PERCENTUAL ESPERADO

   Começa em 0% na primeira janela encontrada
   e cresce até 100% às 17:30.
   ========================================== */

function obterPercentualEsperado(){

var primeiraJanela =
obterPrimeiraJanela();


var agora =
new Date();


var minutosAgora =

agora.getHours() * 60

+

agora.getMinutes();


/* Nenhuma janela válida */

if(
primeiraJanela === null
){

return {

percentual:0,

iniciado:false,

primeiraJanela:null

};

}


/* Antes da primeira janela */

if(
minutosAgora <
primeiraJanela
){

return {

percentual:0,

iniciado:false,

primeiraJanela:
primeiraJanela

};

}


/* FINAL DA CURVA = 17:30 */

var horarioFinal =
17 * 60 + 30;


/* Proteção */

if(
primeiraJanela >=
horarioFinal
){

return {

percentual:0,

iniciado:true,

primeiraJanela:
primeiraJanela

};

}


/* Depois de 17:30 */

if(
minutosAgora >=
horarioFinal
){

return {

percentual:100,

iniciado:true,

primeiraJanela:
primeiraJanela

};

}


/* Tempo decorrido */

var tempoDecorrido =

minutosAgora

-

primeiraJanela;


/* Tempo total */

var tempoTotal =

horarioFinal

-

primeiraJanela;


/* Percentual esperado */

var percentualEsperado =

(
tempoDecorrido
/
tempoTotal
)

*

100;


if(
percentualEsperado < 0
){

percentualEsperado =
0;

}


if(
percentualEsperado > 100
){

percentualEsperado =
100;

}


return {

percentual:
percentualEsperado,

iniciado:true,

primeiraJanela:
primeiraJanela

};

}


/* ==========================================
   STATUS DO PROGRESSO
   ========================================== */

function obterStatusProgresso(
percentualReal,
resultadoEsperado
){


/* OPERAÇÃO CONCLUÍDA */

if(
percentualReal >= 100
){

return {

status:"CONCLUÍDO",

cor:"verde"

};

}


/* NÃO CHEGOU NA PRIMEIRA JANELA */

if(
!resultadoEsperado.iniciado
){

return {

status:"AGUARDANDO INÍCIO",

cor:"neutro"

};

}


var percentualEsperado =
resultadoEsperado.percentual;


var diferenca =

percentualReal

-

percentualEsperado;


/* 5 pontos ou mais adiantado */

if(
diferenca >= 5
){

return {

status:"ADIANTADO",

cor:"verde"

};

}


/* Até 5 pontos abaixo */

if(
diferenca >= -5
){

return {

status:"NO RITMO",

cor:"azul"

};

}


/* Entre -5 e -10 */

if(
diferenca >= -10
){

return {

status:"ATENÇÃO",

cor:"amarelo"

};

}


/* Mais de 10 pontos abaixo */

return {

status:"ATRASADO",

cor:"vermelho"

};

}


/* ==========================================
   CARREGAMENTO DA PLANILHA
   ========================================== */

async function carregarDados(){

try{

var resposta =
await fetch(

csvUrl +

"&t=" +

new Date().getTime()

);


var texto =
await resposta.text();


var linhas =
texto
.replace(/\r/g,"")
.split("\n");


dadosOperacao = [];


var secaoAtual =
"";


for(
var i = 0;
i < linhas.length;
i++
){

var colunas =

linhas[i]

.split(",")

.map(

function(x){

return x
.replace(/^"|"$/g,"")
.trim();

}

);


var primeira =

(
colunas[0]
||
""
)

.trim()

.toUpperCase();


if(
primeira === "ENERGY"
||
primeira === "AUTOMOTIVO"
){

secaoAtual =
primeira;

continue;

}


if(
primeira ===
"TRANSPORTADORA"
){

continue;

}


if(!primeira){

continue;

}


if(!secaoAtual){

continue;

}


dadosOperacao.push({

secao:
secaoAtual,

transportadora:
colunas[0] || "",

operacao:
colunas[1] || "",

veiculo:
colunas[2] || "",

janela:
colunas[3] || "",

peso:
colunas[4] || "",

status:
colunas[5] || "",

chegada:
colunas[6] || "",

inicio:
colunas[7] || "",

fim:
colunas[8] || ""

});

}


renderizarPainel();

}

catch(erro){

document
.getElementById(
"conteudo"
)
.innerHTML =

"<div style='margin:20px;padding:20px;background:#7a1724;color:#fff;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;'>⚠️ Erro ao carregar os dados.</div>";

}

}


/* ==========================================
   RENDERIZAÇÃO DO PAINEL
   ========================================== */

function renderizarPainel(){

var atrasados =
0;

var aguardando =
0;

var noPatio =
0;

var emProcesso =
0;

var finalizados =
0;


for(
var i = 0;
i < dadosOperacao.length;
i++
){

var s =
normalizarStatus(
dadosOperacao[i].status
);


if(
s.indexOf(
"ATRASADO"
) !== -1
){

atrasados++;

}

else if(

s.indexOf(
"NO PATIO"
) !== -1

||

s.indexOf(
"NO PÁTIO"
) !== -1

){

noPatio++;

}

else if(
s.indexOf(
"EM PROCESSO"
) !== -1
){

emProcesso++;

}

else if(
s.indexOf(
"AGUARDANDO"
) !== -1
){

aguardando++;

}

else if(
s.indexOf(
"FINALIZADO"
) !== -1
){

finalizados++;

}

}


/* ==========================================
   CARDS KPI
   ========================================== */

document
.getElementById(
"painelKpi"
)
.innerHTML = `

<div class="kpi kpi-atrasado ${atrasados > 0 ? 'alerta-ativo' : ''}">
🚨 ATRASADOS:
${atrasados}
</div>

<div class="kpi kpi-aguardando">
⏳ AGUARDANDO:
${aguardando}
</div>

<div class="kpi kpi-patio">
🚚 NO PATIO:
${noPatio}
</div>

<div class="kpi kpi-processo">
📦 EM PROCESSO:
${emProcesso}
</div>

<div class="kpi kpi-finalizado">
✅ FINALIZADOS:
${finalizados}
</div>

`;


/* ==========================================
   PROGRESSO REAL
   ========================================== */

var totalVeiculos =
dadosOperacao.length;


var percentual =
0;


if(
totalVeiculos > 0
){

percentual =
Math.round(

(
finalizados
/
totalVeiculos
)

*

100

);

}


/* PERCENTUAL ESPERADO */

var resultadoEsperado =
obterPercentualEsperado();


/* STATUS */

var resultadoProgresso =
obterStatusProgresso(

percentual,

resultadoEsperado

);


var corProgresso =
resultadoProgresso.cor;


var statusProgresso =
resultadoProgresso.status;


/* ==========================================
   BARRA DE PROGRESSO
   ========================================== */

document
.getElementById(
"progressoOperacao"
)
.innerHTML = `

<div class="progresso-box">

<div class="progresso-label ${corProgresso}">
${statusProgresso}
</div>

<div class="progresso-fundo">

<div
class="progresso-barra ${corProgresso}"
style="width:${percentual}%">
</div>

</div>

<div class="progresso-percentual ${corProgresso}">
${percentual}%
</div>

</div>

`;


/* ==========================================
   TABELAS
   ========================================== */

var secoes = [
"ENERGY",
"AUTOMOTIVO"
];


var html =
"";


for(
var s = 0;
s < secoes.length;
s++
){

var nomeSecao =
secoes[s];


var itens =

dadosOperacao.filter(

function(item){

return (
item.secao ===
nomeSecao
);

}

);


if(
itens.length === 0
){

continue;

}


itens.sort(

function(a,b){

var prioridadeA =
prioridadeStatus(
a.status
);


var prioridadeB =
prioridadeStatus(
b.status
);


if(
prioridadeA !==
prioridadeB
){

return (
prioridadeA
-
prioridadeB
);

}


return 0;

}

);


html += `

<div class="section">

<div class="section-title">
${nomeSecao}
</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>TRANSPORTADORA</th>

<th>OPERAÇÃO</th>

<th>VEÍCULO</th>

<th>JANELA</th>

<th>PESO (KG)</th>

<th>STATUS</th>

<th>CHEGADA</th>

<th>INÍCIO CARR.</th>

<th>FIM CARR.</th>

</tr>

</thead>

<tbody>

`;


for(
var j = 0;
j < itens.length;
j++
){

var item =
itens[j];


var classe =
classeStatus(
item.status
);


var statusTexto =
statusEmoticon(
item.status
);


html += `

<tr class="${classe}">

<td>
${item.transportadora}
</td>

<td>
${item.operacao}
</td>

<td>
${item.veiculo}
</td>

<td class="janela">
${item.janela}
</td>

<td>
${item.peso}
</td>

<td>
${statusTexto}
</td>

<td class="horario">
${item.chegada}
</td>

<td class="horario">
${item.inicio}
</td>

<td class="horario">
${item.fim}
</td>

</tr>

`;

}


html += `

</tbody>

</table>

</div>

</div>

`;

}


document
.getElementById(
"conteudo"
)
.innerHTML =
html;

}


/* ==========================================
   INICIALIZAÇÃO
   ========================================== */

carregarDados();

carregarNFs();


setInterval(
carregarDados,
30000
);


setInterval(
carregarNFs,
30000
);

</script>

</body>

</html>
