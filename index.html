<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERAÇÃO YUSEN - EXPEDIÇÃO</title>

<style>

body{
margin:0;
background:#001B5E;
color:white;
font-family:Arial, sans-serif;
}

.header{
background:#001447;
text-align:center;
padding:20px;
}

.header h1{
margin:0;
font-size:56px;
}

#relogio{
margin-top:10px;
font-size:28px;
}

.kpis{
display:flex;
justify-content:center;
gap:20px;
padding:15px;
flex-wrap:wrap;
}

.kpi{
padding:15px 25px;
border-radius:10px;
font-size:24px;
font-weight:bold;
}

.kpi-atrasado{
background:#D32F2F;
}

.kpi-carregamento{
background:#F9A825;
color:black;
}

.kpi-carregado{
background:#2E7D32;
}

.section{
margin:20px;
}

.section-title{
background:#FFC107;
color:black;
padding:12px;
text-align:center;
font-size:38px;
font-weight:bold;
border-radius:8px 8px 0 0;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#FFC107;
color:black;
padding:18px;
font-size:30px;
font-weight:bold;
}

td{
padding:18px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.atrasado{
background:#D32F2F;
}

.emcarregamento{
background:#F9A825;
color:black;
}

.carregado{
background:#2E7D32;
}

.transito{
background:#1976D2;
}

.patio{
background:#616161;
}

.footer{
text-align:center;
padding:20px;
font-size:20px;
color:#ddd;
}

</style>

</head>

<body>

<div class="header">

<h1>🚚 OPERAÇÃO YUSEN - EXPEDIÇÃO</h1>

<div id="relogio"></div>

</div>

<div class="kpis" id="painelKpi"></div>

<div id="conteudo"></div>

<div class="footer">
Atualização automática a cada 30 segundos
</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";

function atualizarRelogio(){

const agora = new Date();

document.getElementById("relogio").innerHTML =
agora.toLocaleDateString('pt-BR')
+ " - " +
agora.toLocaleTimeString('pt-BR');

}

setInterval(atualizarRelogio,1000);
atualizarRelogio();

async function carregarDados(){

const resposta = await fetch(csvUrl);
const texto = await resposta.text();

const linhas = texto.split("\n");

let html = "";

let atrasados = 0;
let carregamento = 0;
let carregados = 0;

let tabelaAberta = false;

for(let i=0;i<linhas.length;i++){

let colunas = linhas[i]
.split(",")
.map(x=>x.replace(/"/g,"").trim());

if(colunas[0] === "ENERGY" || colunas[0] === "AUTOMOTIVO"){

if(tabelaAberta){
html += "</table></div>";
}

html += `
<div class="section">
<div class="section-title">${colunas[0]}</div>

<table>

<tr>
<th>TRANSPORTADORA</th>
<th>VEÍCULO</th>
<th>JANELA</th>
<th>STATUS</th>
</tr>
`;

tabelaAberta=true;
continue;

}

if(
colunas[0] &&
colunas[0] !== "TRANSPORTADORA" &&
colunas[0] !== "OPERAÇÃO YUSEN - EXPEDIÇÃO"
){

let status=(colunas[3] || "").toUpperCase();

let classe="";

if(status.includes("ATRASADO")){
classe="atrasado";
atrasados++;
}

else if(status.includes("CARREGAMENTO")){
classe="emcarregamento";
carregamento++;
}

else if(
status.includes("CARREGADO") ||
status.includes("FINALIZADO")
){
classe="carregado";
carregados++;
}

else if(status.includes("TRANSITO")){
classe="transito";
}

else if(status.includes("PATIO")){
classe="patio";
}

html += `
<tr class="${classe}">
<td>${colunas[0]}</td>
<td>${colunas[1] || ""}</td>
<td>${colunas[2] || ""}</td>
<td>${colunas[3] || ""}</td>
</tr>
`;

}

}

if(tabelaAberta){
html += "</table></div>";
}

document.getElementById("conteudo").innerHTML = html;

document.getElementById("painelKpi").innerHTML = `

<div class="kpi kpi-atrasado">
🚨 ATRASADOS: ${atrasados}
</div>

<div class="kpi kpi-carregamento">
📦 CARREGANDO: ${carregamento}
</div>

<div class="kpi kpi-carregado">
✅ CARREGADOS: ${carregados}
</div>

`;

}

carregarDados();

setInterval(carregarDados,30000);

</script>

</body>
</html>
