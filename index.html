<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OPERAÇÃO YUSEN - PANASONIC SJC</title>

<style>

/* ==================================================
   CONFIGURAÇÕES GERAIS
================================================== */

:root{

  --bg:#0b2441;

  --header:linear-gradient(
    90deg,
    #0d3d68 0%,
    #0f4d7c 35%,
    #0a2d49 100%
  );

  --line:rgba(255,255,255,0.12);

  --text:#edf4ff;
  --muted:#dfeafc;

  --yellow:#f6d34c;
  --yellow-strong:#e8c33b;

  --purple:#9d69ff;
  --purple-strong:#7c4ee4;

  --green:#34d38f;
  --green-strong:#20a86c;

  --orange:#ff9f1c;
  --orange-strong:#e67e00;

  --shadow:
    0 14px 32px
    rgba(0,0,0,0.28);

}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:

    radial-gradient(
      circle at top,
      rgba(76,132,214,0.28),
      transparent 35%
    ),

    linear-gradient(
      180deg,
      var(--bg) 0%,
      #050f1d 100%
    );

  color:var(--text);

  font-family:
    Arial,
    sans-serif;

}


/* ==================================================
   CABEÇALHO
================================================== */

.header{

  background:var(--header);

  padding:20px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-bottom:
    1px solid
    var(--line);

  box-shadow:
    var(--shadow);

  min-height:105px;

}


.header-text{

  width:100%;

  text-align:center;

}


.header h1{

  margin:0;

  font-size:32px;

  letter-spacing:0.5px;

  font-weight:700;

  text-transform:uppercase;

  text-shadow:
    0 3px 10px
    rgba(0,0,0,0.28);

}


#relogio{

  margin-top:6px;

  font-size:18px;

  color:var(--muted);

  letter-spacing:0.5px;

  font-weight:600;

}


/* ==================================================
   TICKER DAS NF'S
================================================== */

.ticker{

  width:100%;

  height:55px;

  background:

    linear-gradient(
      90deg,
      #081421,
      #111d29,
      #081421
    );

  border-top:
    1px solid
    rgba(255,255,255,0.08);

  border-bottom:
    2px solid
    var(--yellow);

  display:flex;

  align-items:center;

  overflow:hidden;

  box-shadow:
    0 6px 18px
    rgba(0,0,0,0.30);

}


/* TÍTULO FIXO */

.ticker-label{

  height:100%;

  min-width:230px;

  padding:
    0 20px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      var(--yellow),
      var(--yellow-strong)
    );

  color:#111827;

  font-size:17px;

  font-weight:900;

  letter-spacing:0.5px;

  z-index:5;

  box-shadow:
    8px 0 18px
    rgba(0,0,0,0.35);

  white-space:nowrap;

}


/* ÁREA DO MOVIMENTO */

.ticker-area{

  position:relative;

  flex:1;

  overflow:hidden;

  height:100%;

  display:flex;

  align-items:center;

}


/* CONTEÚDO DAS NF'S */

.ticker-content{

  position:absolute;

  white-space:nowrap;

  left:100%;

  font-size:20px;

  font-weight:900;

  color:#ffffff;

  letter-spacing:1px;

  animation:
    tickerMovimento
    25s
    linear
    infinite;

}


/* ANIMAÇÃO */

@keyframes tickerMovimento{

  from{

    transform:
      translateX(0);

  }

  to{

    transform:
      translateX(-200%);

  }

}


/* PAUSA AO PASSAR O MOUSE */

.ticker-area:hover
.ticker-content{

  animation-play-state:
    paused;

}


/* ==================================================
   KPIs
================================================== */

.kpis{

  display:flex;

  justify-content:center;

  gap:16px;

  padding:
    18px 20px 8px;

  flex-wrap:wrap;

}


.kpi{

  min-width:180px;

  padding:
    15px 18px;

  border-radius:14px;

  font-size:17px;

  font-weight:800;

  letter-spacing:0.3px;

  text-align:center;

  box-shadow:
    var(--shadow);

  border:
    1px solid
    rgba(255,255,255,0.08);

  text-transform:uppercase;

}


/* ATRASADOS */

.kpi-atrasado{

  background:

    linear-gradient(
      135deg,
      #ff4b5d,
      #e22d42
    );

  box-shadow:

    0 0 20px
    rgba(255,75,93,0.50),

    var(--shadow);

  animation:
    pulse-alert
    2s
    infinite;

  color:white;

}


@keyframes pulse-alert{

  0%,
  100%{

    transform:scale(1);

  }

  50%{

    transform:scale(1.04);

  }

}


/* AGUARDANDO */

.kpi-aguardando{

  background:

    linear-gradient(
      135deg,
      #536475,
      #344454
    );

  color:white;

}


/* NO PATIO */

.kpi-patio{

  background:

    linear-gradient(
      135deg,
      var(--orange),
      var(--orange-strong)
    );

  color:#17130c;

}


/* EM PROCESSO */

.kpi-processo{

  background:

    linear-gradient(
      135deg,
      var(--purple),
      var(--purple-strong)
    );

  color:white;

}


/* FINALIZADOS */

.kpi-finalizado{

  background:

    linear-gradient(
      135deg,
      var(--green),
      var(--green-strong)
    );

  color:white;

}


/* ==================================================
   SEÇÕES
================================================== */

.section{

  margin:
    20px 18px 10px;

  background:
    rgba(13,28,44,0.78);

  border:
    1px solid
    var(--line);

  border-radius:14px;

  overflow:hidden;

  box-shadow:
    var(--shadow);

}


.section-title{

  background:

    linear-gradient(
      90deg,
      var(--yellow),
      var(--yellow-strong)
    );

  color:#0f172a;

  padding:
    11px 20px;

  text-align:center;

  font-size:23px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;

}


/* ==================================================
   TABELA
================================================== */

.table-container{

  width:100%;

  overflow-x:auto;

}


table{

  width:100%;

  border-collapse:collapse;

  table-layout:auto;

}


th{

  background:
    rgba(20,23,28,0.95);

  color:var(--yellow);

  padding:
    12px 8px;

  font-size:15px;

  font-weight:800;

  text-transform:uppercase;

  border-bottom:
    1px solid
    var(--line);

  white-space:nowrap;

}


td{

  padding:
    12px 8px;

  text-align:center;

  font-size:17px;

  font-weight:700;

  border-bottom:
    1px solid
    rgba(255,255,255,0.06);

  background:
    rgba(255,255,255,0.03);

  color:#f4f8ff;

  white-space:nowrap;

}


tr:last-child td{

  border-bottom:none;

}


/* ==================================================
   TAMANHO DAS COLUNAS
================================================== */

.col-transportadora{
  min-width:150px;
}

.col-operacao{
  min-width:110px;
}

.col-veiculo{
  min-width:110px;
}

.col-janela{
  min-width:90px;
}

.col-peso{
  min-width:100px;
}

.col-status{
  min-width:150px;
}

.col-horario{
  min-width:110px;
}


/* ==================================================
   CORES DAS LINHAS
================================================== */


/* AGUARDANDO */

tr.aguardando td{

  background:
    rgba(50,65,80,0.78)
    !important;

  color:#edf4ff
    !important;

}


/* ATRASADO */

tr.atrasado td{

  background:
    rgba(103,15,29,0.90)
    !important;

  color:#fff3f5
    !important;

  font-weight:900;

  text-shadow:
    0 0 10px
    rgba(255,93,108,0.45);

}


/* NO PATIO */

tr.patio td{

  background:
    rgba(116,76,13,0.87)
    !important;

  color:#fff6d8
    !important;

}


/* EM PROCESSO */

tr.processo td{

  background:
    rgba(75,46,122,0.82)
    !important;

  color:#f2ebff
    !important;

}


/* FINALIZADO */

tr.finalizado td{

  background:
    rgba(20,77,58,0.85)
    !important;

  color:#ebfff5
    !important;

}


/* ==================================================
   HORÁRIOS
================================================== */

.horario{

  font-weight:900;

  font-size:18px;

}


.janela{

  color:#ff6874;

  font-weight:900;

}


/* ==================================================
   RODAPÉ
================================================== */

.footer{

  text-align:center;

  padding:
    18px 20px 28px;

  font-size:14px;

  color:var(--muted);

  letter-spacing:0.4px;

}


/* ==================================================
   RESPONSIVO
================================================== */

@media(max-width:1100px){

  th{

    font-size:12px;

  }

  td{

    font-size:14px;

  }

}


@media(max-width:900px){

  .header{

    padding:
      18px 10px;

  }


  .header h1{

    font-size:25px;

  }


  #relogio{

    font-size:15px;

  }


  .ticker{

    height:48px;

  }


  .ticker-label{

    min-width:160px;

    padding:
      0 10px;

    font-size:13px;

  }


  .ticker-content{

    font-size:16px;

  }


  .kpi{

    min-width:150px;

    font-size:13px;

  }

}

</style>

</head>


<body>


<!-- ==================================================
     CABEÇALHO
================================================== -->

<div class="header">

  <div class="header-text">

    <h1>
      OPERAÇÃO YUSEN - PANASONIC SJC
    </h1>

    <div id="relogio"></div>

  </div>

</div>


<!-- ==================================================
     TICKER NF'S PENDENTES
================================================== -->

<div class="ticker">

  <div class="ticker-label">

    📄 NF'S PENDENTES

  </div>


  <div class="ticker-area">

    <div
      class="ticker-content"
      id="tickerNFs"
    >

      Carregando NF's...

    </div>

  </div>

</div>


<!-- ==================================================
     KPIs
================================================== -->

<div
  class="kpis"
  id="painelKpi">
</div>


<!-- ==================================================
     TABELAS
================================================== -->

<div id="conteudo"></div>


<!-- ==================================================
     RODAPÉ
================================================== -->

<div class="footer">

  Atualização automática a cada 30 segundos

</div>



<script>


/* ==================================================
   URL PRINCIPAL
================================================== */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=0&single=true&output=csv";


/* ==================================================
   URL ABA PIN - NF'S PENDENTES
================================================== */

const csvNFs =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTN1vOH2C4htkHC3NnXIqy7JcjCe_6mfulx2Qg1NuVR6zB73jYm81QKBbaPbGoBZIjGdvB777wo7TYm/pub?gid=141918402&single=true&output=csv";


/* ==================================================
   RELÓGIO
================================================== */

function atualizarRelogio(){

  const agora =
    new Date();


  document
    .getElementById("relogio")
    .innerHTML =

    agora.toLocaleDateString(
      "pt-BR"
    )

    +

    " - "

    +

    agora.toLocaleTimeString(
      "pt-BR"
    );

}


setInterval(
  atualizarRelogio,
  1000
);


atualizarRelogio();


/* ==================================================
   STATUS COM ÍCONES
================================================== */

function statusEmoticon(status){

  const s =
    (status || "")
    .trim()
    .toUpperCase();


  if(
    s.includes("ATRASADO")
  ){

    return "🚨 ATRASADO";

  }


  if(
    s.includes("AGUARDANDO")
  ){

    return "⏳ AGUARDANDO";

  }


  if(
    s.includes("NO PATIO")
    ||
    s.includes("NO PÁTIO")
  ){

    return "🚚 NO PATIO";

  }


  if(
    s.includes("EM PROCESSO")
  ){

    return "📦 EM PROCESSO";

  }


  if(
    s.includes("FINALIZADO")
  ){

    return "✅ FINALIZADO";

  }


  return status || "";

}


/* ==================================================
   CLASSE DO STATUS
================================================== */

function classeStatus(status){

  const s =
    (status || "")
    .trim()
    .toUpperCase();


  if(
    s.includes("ATRASADO")
  ){

    return "atrasado";

  }


  if(
    s.includes("AGUARDANDO")
  ){

    return "aguardando";

  }


  if(
    s.includes("NO PATIO")
    ||
    s.includes("NO PÁTIO")
  ){

    return "patio";

  }


  if(
    s.includes("EM PROCESSO")
  ){

    return "processo";

  }


  if(
    s.includes("FINALIZADO")
  ){

    return "finalizado";

  }


  return "";

}


/* ==================================================
   CARREGA NF'S
================================================== */

async function carregarNFs(){

  try{


    const resposta =
      await fetch(

        csvNFs +

        "&t=" +

        new Date().getTime()

      );


    if(
      !resposta.ok
    ){

      throw new Error(
        "Erro HTTP: " +
        resposta.status
      );

    }


    const texto =
      await resposta.text();


    const linhas =
      texto
      .replace(/\r/g,"")
      .split("\n");


    let nfs = [];


    /* COMEÇA NA LINHA 2
       POIS A LINHA 1 É NF'S
    */

    for(
      let i = 1;
      i < linhas.length;
      i++
    ){


      const nf =
        linhas[i]

        .split(",")[0]

        .replace(/"/g,"")

        .trim();


      if(
        nf !== ""
      ){

        nfs.push(nf);

      }

    }


    const ticker =
      document
      .getElementById(
        "tickerNFs"
      );


    if(
      nfs.length > 0
    ){


      const textoTicker =
        nfs

        .map(

          nf =>
            `📄 NF ${nf}`

        )

        .join(

          "　◆　"

        );


      /*
         REPETE O CONTEÚDO PARA
         O MOVIMENTO FICAR MAIS CONTÍNUO
      */

      ticker.innerHTML =

        textoTicker

        +

        "　◆　"

        +

        textoTicker;

    }


    else{


      ticker.innerHTML =
        "✅ NENHUMA NF PENDENTE";


    }


  }


  catch(erro){


    console.error(
      "Erro ao carregar NF's:",
      erro
    );


    document
      .getElementById(
        "tickerNFs"
      )
      .innerHTML =
      "⚠️ ERRO AO CARREGAR NF'S";


  }

}


/* ==================================================
   CARREGAR DADOS OPERACIONAIS
================================================== */

async function carregarDados(){

  try{


    const resposta =
      await fetch(

        csvUrl +

        "&t=" +

        new Date().getTime()

      );


    if(
      !resposta.ok
    ){

      throw new Error(
        "Erro HTTP: " +
        resposta.status
      );

    }


    const texto =
      await resposta.text();


    const linhas =
      texto
      .replace(/\r/g,"")
      .split("\n");


    let html = "";


    let secaoAtual = "";


    let tabelaAberta =
      false;


    /* ==================================================
       CONTADORES
    ================================================== */

    let atrasados = 0;

    let aguardando = 0;

    let noPatio = 0;

    let emProcesso = 0;

    let finalizados = 0;


    /* ==================================================
       PERCORRE PLANILHA
    ================================================== */

    for(
      let i = 0;
      i < linhas.length;
      i++
    ){


      let colunas =
        linhas[i]

        .split(",")

        .map(

          x =>

            x
            .replace(/^"|"$/g,"")
            .trim()

        );


      const primeiraColuna =
        (
          colunas[0]
          ||
          ""
        )

        .trim()

        .toUpperCase();


      /* ==================================================
         ENERGY / AUTOMOTIVO
      ================================================== */

      if(
        primeiraColuna === "ENERGY"
        ||
        primeiraColuna === "AUTOMOTIVO"
      ){


        if(
          tabelaAberta
        ){

          html += `

          </tbody>

          </table>

          </div>

          </div>

          `;

        }


        secaoAtual =
          primeiraColuna;


        html += `

        <div class="section">


          <div class="section-title">

            ${secaoAtual}

          </div>


          <div class="table-container">


            <table>


              <thead>


                <tr>


                  <th class="col-transportadora">

                    TRANSPORTADORA

                  </th>


                  <th class="col-operacao">

                    OPERAÇÃO

                  </th>


                  <th class="col-veiculo">

                    VEÍCULO

                  </th>


                  <th class="col-janela">

                    JANELA

                  </th>


                  <th class="col-peso">

                    PESO (KG)

                  </th>


                  <th class="col-status">

                    STATUS

                  </th>


                  <th class="col-horario">

                    CHEGADA

                  </th>


                  <th class="col-horario">

                    INÍCIO CARR.

                  </th>


                  <th class="col-horario">

                    FIM CARR.

                  </th>


                </tr>


              </thead>


              <tbody>

        `;


        tabelaAberta =
          true;


        continue;

      }


      /* ==================================================
         IGNORA CABEÇALHO
      ================================================== */

      if(
        primeiraColuna ===
        "TRANSPORTADORA"
      ){

        continue;

      }


      /* ==================================================
         IGNORA LINHAS VAZIAS
      ================================================== */

      if(
        !primeiraColuna
      ){

        continue;

      }


      /* ==================================================
         IGNORA ANTES DE ENCONTRAR UMA SEÇÃO
      ================================================== */

      if(
        !secaoAtual
      ){

        continue;

      }


      /* ==================================================
         COLUNAS DA PLANILHA

         A = TRANSPORTADORA
         B = OPERAÇÃO
         C = VEÍCULO
         D = JANELA
         E = PESO
         F = STATUS
         G = CHEGADA
         H = INÍCIO CARR.
         I = FIM CARR.
      ================================================== */


      const transportadora =
        colunas[0] || "";


      const operacao =
        colunas[1] || "";


      const veiculo =
        colunas[2] || "";


      const janela =
        colunas[3] || "";


      const peso =
        colunas[4] || "";


      const statusRaw =
        colunas[5] || "";


      const chegada =
        colunas[6] || "";


      const inicio =
        colunas[7] || "";


      const fim =
        colunas[8] || "";


      /* ==================================================
         STATUS
      ================================================== */

      const status =
        statusRaw

        .trim()

        .toUpperCase();


      const classe =
        classeStatus(
          status
        );


      /* ==================================================
         CONTADORES
      ================================================== */

      if(
        status.includes(
          "ATRASADO"
        )
      ){

        atrasados++;

      }


      else if(
        status.includes(
          "AGUARDANDO"
        )
      ){

        aguardando++;

      }


      else if(

        status.includes(
          "NO PATIO"
        )

        ||

        status.includes(
          "NO PÁTIO"
        )

      ){

        noPatio++;

      }


      else if(
        status.includes(
          "EM PROCESSO"
        )
      ){

        emProcesso++;

      }


      else if(
        status.includes(
          "FINALIZADO"
        )
      ){

        finalizados++;

      }


      const statusTexto =
        statusEmoticon(
          statusRaw
        );


      /* ==================================================
         MONTA A LINHA
      ================================================== */

      html += `


      <tr class="${classe}">


        <td>

          ${transportadora}

        </td>


        <td>

          ${operacao}

        </td>


        <td>

          ${veiculo}

        </td>


        <td class="janela">

          ${janela}

        </td>


        <td>

          ${peso}

        </td>


        <td>

          ${statusTexto}

        </td>


        <td class="horario">

          ${chegada}

        </td>


        <td class="horario">

          ${inicio}

        </td>


        <td class="horario">

          ${fim}

        </td>


      </tr>


      `;


    }


    /* ==================================================
       FECHA ÚLTIMA TABELA
    ================================================== */

    if(
      tabelaAberta
    ){

      html += `

      </tbody>

      </table>

      </div>

      </div>

      `;

    }


    /* ==================================================
       MOSTRA TABELAS
    ================================================== */

    document
      .getElementById(
        "conteudo"
      )
      .innerHTML =
      html;


    /* ==================================================
       MOSTRA KPIs
    ================================================== */

    document
      .getElementById(
        "painelKpi"
      )
      .innerHTML = `


      <div class="kpi kpi-atrasado">

        🚨 ATRASADOS:
        ${atrasados}

      </div>


      <div class="kpi kpi-aguardando">

        ⏳ AGUARDANDO:
        ${aguardando}

      </div>


      <div class="kpi kpi-patio">

        🚚 NO PATIO:
        ${noPatio}

      </div>


      <div class="kpi kpi-processo">

        📦 EM PROCESSO:
        ${emProcesso}

      </div>


      <div class="kpi kpi-finalizado">

        ✅ FINALIZADOS:
        ${finalizados}

      </div>


      `;


  }


  catch(erro){


    console.error(
      "Erro ao carregar dados:",
      erro
    );


    document
      .getElementById(
        "conteudo"
      )
      .innerHTML = `


      <div

        style="

          margin:20px;

          padding:20px;

          background:#7a1724;

          color:white;

          border-radius:12px;

          text-align:center;

          font-size:20px;

          font-weight:bold;

        "

      >
